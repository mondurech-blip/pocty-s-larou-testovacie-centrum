<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lara Math">
<meta name="theme-color" content="#b38cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Math with Lara</title>
<script>
// diagnostika: ak sa niečo pokazí, chyba sa zobrazí dole na stránke
window.addEventListener('error', function (e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#ffdede;color:#600;padding:10px;font:13px sans-serif;z-index:99999;word-break:break-all';
  var sk = /\/sk(\/|\/index\.html)?$/.test(location.pathname) || /[?&]lang=sk/.test(location.search);
  d.textContent = sk ? 'CHYBA: ' + (e.message || 'neznáma') + ' (riadok ' + (e.lineno || '?') + ')' : 'ERROR: ' + (e.message || 'unknown') + ' (line ' + (e.lineno || '?') + ')';
  (document.body || document.documentElement).appendChild(d);
});
</script>
<style>
:root{
  --bg1:#fdf0ff; --bg2:#e2f3ff; --card:#ffffff; --ink:#3b2a5a; --muted:#8c7fa8;
  --pink:#ff7eb6; --purple:#b38cff; --blue:#6cb8ff; --yellow:#ffc83d; --green:#44c48a; --red:#ff7a6b;
  --line:#e6dcf5; --shadow:0 10px 30px rgba(90,60,150,.15);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1d44; --bg2:#15283f; --card:#35295c; --ink:#f4eeff; --muted:#b7a8d6;
    --line:#4a3c75; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1d44; --bg2:#15283f; --card:#35295c; --ink:#f4eeff; --muted:#b7a8d6;
  --line:#4a3c75; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;-webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:pan-y}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height:100vh; background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed; color:var(--ink);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif; overflow-x:hidden;
}
.hidden{display:none !important}
.wrap{max-width:min(860px,100%);margin:0 auto;padding:4px 16px 40px;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;padding:10px 0;z-index:5}
.icon{width:60px;height:60px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:24px;cursor:pointer}
.icon.txt{font-size:14px;font-weight:800;color:var(--ink)}
.stars{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;font-weight:700;font-size:18px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin:12px 0}
h1{font-size:28px;margin:6px 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.mascot{font-size:88px;text-align:center;line-height:1.1;margin:6px 0;display:block;cursor:pointer;user-select:none}
.bigbtn{width:100%;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:var(--shadow);cursor:pointer;margin-top:8px}
.bigbtn.alt{background:linear-gradient(135deg,var(--blue),#5ee0c1)}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mchip{padding:4px 8px !important;line-height:0;min-width:60px;min-height:60px}
.mchip svg{width:40px;height:40px;display:block;margin:0 auto}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--muted)}
.tip{color:var(--muted);font-size:16px;text-align:center;margin:4px 0}

/* hra */
.progress{display:flex;justify-content:center;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.pd{width:14px;height:14px;border-radius:50%;background:var(--line);transition:transform .2s}
.pd.ok{background:var(--green)} .pd.bad{background:var(--muted)}
.pd.cur{background:var(--pink);transform:scale(1.35)}
.rowtop{display:flex;justify-content:space-between;align-items:center;min-height:64px}
.mascotP svg{width:64px;height:64px}
.story{font-size:20px;font-weight:600;line-height:1.35;margin:4px 0 8px}
.task{font-size:46px;font-weight:800;text-align:center;margin:8px 0 4px;letter-spacing:.02em}
.q{display:inline-block;min-width:1.3em;padding:0 .2em;border-radius:14px;background:var(--yellow);color:#3b2a5a;text-align:center}
.hint{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0;min-height:24px}
.frames{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,26px);gap:5px;padding:8px;border-radius:14px;background:rgba(255,255,255,.4)}
.cell{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);position:relative;display:inline-block}
.cell.empty{border-color:transparent;background:transparent}
.cell.blue{background:var(--blue);border-color:var(--blue)}
.cell.yellow{background:var(--yellow);border-color:var(--yellow)}
.cell.gold{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.cell.ghost{border:2px dashed var(--muted)}
.cell.out{border-color:var(--muted);border-style:dotted;background:transparent}
.cell.out::after{content:none}   /* žiadne červené krížiky: chyba sa netrestá */
.feedback{min-height:30px;text-align:center;font-size:20px;font-weight:700;margin-top:6px}
.cell.tap{cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.cell.gone{animation:fly .6s ease-in forwards;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes fly{to{transform:translateY(-70px) scale(.4);opacity:0}}
.tapmsg{color:var(--pink);font-weight:700}
.flrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:260px;margin:4px auto}
.fl{display:inline-block;width:34px;height:34px;transition:opacity .4s}
.fl svg{width:34px;height:34px;display:block}
.fl.tap{cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.fl.gone{animation:fly .6s ease-in forwards;pointer-events:none}
/* pomôcka pre dvojciferné čísla */
.help-btn{display:block;margin:0 auto 8px}
.st .role{display:block;font-style:normal;font-size:11px;line-height:1.25;color:var(--muted);font-weight:600;margin-top:2px}
.fl.faded{opacity:.3}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;transition:opacity .2s}
.pad.off,.cmp.off{opacity:.4;pointer-events:none}
.pad button,.cmp button{font-size:26px;font-weight:700;padding:14px 0;min-height:60px;border-radius:16px;border:0;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer}
.pad button:active,.cmp button:active{transform:translateY(3px);box-shadow:none}
.pad .ok{background:var(--green);color:#fff;box-shadow:0 4px 0 #2f9e6b}
.pad .del{color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;transition:opacity .2s}
.cmp button{font-size:40px;font-weight:800}
.chip.say{margin-bottom:4px}
/* ovládanie pre Laru: aspoň 60 px */
.chip.say,.help-btn{min-height:60px;font-size:17px;padding:10px 18px}

/* animácie */
.happy{animation:bounce .6s}
.sad{animation:shake .5s}
.shake{animation:shake .4s}
@keyframes bounce{30%{transform:translateY(-22px) scale(1.1)}60%{transform:translateY(0)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.plus{position:fixed;right:70px;top:64px;font-weight:800;font-size:22px;color:#e0a100;pointer-events:none;animation:up 1.2s forwards;z-index:20}
@keyframes up{to{opacity:0;transform:translateY(-60px)}}
.conf{position:fixed;top:-40px;pointer-events:none;animation:fall 2.2s ease-in forwards;z-index:20}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco span{position:absolute;bottom:-60px;opacity:.15;animation:float linear infinite}
@keyframes float{to{transform:translateY(-120vh)}}
.idle{animation:idle 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* obchod */
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{border:2px solid var(--line);border-radius:18px;padding:12px 8px;background:transparent;color:var(--ink);cursor:pointer;text-align:center;font-size:15px;font-weight:700}
.st .se svg{display:block;margin:0 auto;width:56px;height:56px}
.st.owned{border-color:var(--green)}
.st small{display:block;color:var(--muted);margin-top:4px;font-weight:600}
#shopMsg{min-height:24px;font-weight:700}

/* Lara a spoločník */
.duo{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:6px 0}
.duo svg,.lara svg{display:block}
.track{position:relative;padding-top:58px}
.rider{position:absolute;bottom:22px;left:0;transform:translateX(-50%);transition:left .5s ease;pointer-events:none}
.rider svg{width:48px;height:48px;display:block}
.mascotP svg{width:64px;height:64px}
/* záhrada – zámocký park: pevný pôdorys 1000 × 700, všetko sa škáluje spolu */
.gscene{position:relative;width:100%;aspect-ratio:1000/700;border-radius:22px;overflow:hidden;--s1:#b9e6ff;--s2:#eefcff;--g1:#8fd490;--g2:#68bd6e;--hill:#86cf86;--sun:#ffd36e;background:linear-gradient(180deg,var(--g1) 0,var(--g2) 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.gscene.spring{--s1:#c4eeff;--s2:#f3fff0;--g1:#a7e89a;--g2:#72c86f;--hill:#9ad994;--sun:#ffe07a}
.gscene.summer{--s1:#8fdcff;--s2:#fff7d6;--g1:#9be07a;--g2:#5fb24e;--hill:#7cc766;--sun:#ffc93c}
.gscene.autumn{--s1:#ffd3a0;--s2:#fff1dc;--g1:#e2b66a;--g2:#b9864a;--hill:#d9a25a;--sun:#ffb347}
.gscene.winter{--s1:#d6e6f7;--s2:#f5fbff;--g1:#f7fcff;--g2:#dbe9f6;--hill:#eef7ff;--sun:#fff3c4}
/* záhrada je o kúsok širšia než text karty: používa aj okraj karty */
#homeGarden,#doneGarden{margin:0 -18px}
#land svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#decor{position:absolute;inset:0;z-index:1;pointer-events:none}
#decor .bld{position:absolute}
#decor .bld svg,#decor .sky svg{display:block;width:100%!important;height:auto!important;overflow:visible}
#decor .sky{position:absolute;animation:bob 3.4s ease-in-out infinite alternate}
/* záhony a zvieratká sú v jednej vrstve so stavbami: poradie určuje výška stanovišťa (z-index) */
#album,#walkers{display:contents}
/* záhon: 112 × 82 jednotiek (celá záhrada je 1000 × 700) */
.plot{position:absolute;width:11.2%;height:11.7%}
/* rastlina: semiačko (g0), potom výhonok (g1), rastlina (g2) a kvet (g3) */
/* rastlina je polovica šírky záhona: aj kvet v plnom raste je nižší než lavička, stôl a studňa */
.plant{position:absolute;left:25%;bottom:4%;width:50%;aspect-ratio:1;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
.plant .seedling,.plant .bloom{position:absolute;left:0;bottom:0;width:100%;transition:transform .8s ease,opacity .6s ease}
.plant .seedling svg,.plant .bloom svg{display:block;width:100%;height:auto}
.plant .bloom{transform-origin:50% 100%}
.plant.g0 .seedling{opacity:1}
.plant.g0 .bloom{opacity:0;transform:scale(.3)}
.plant.g1 .seedling,.plant.g2 .seedling,.plant.g3 .seedling{opacity:0}
.plant.g1 .bloom{opacity:1;transform:scale(.5)}
.plant.g2 .bloom{opacity:1;transform:scale(.8)}
.plant.g3 .bloom{opacity:1;transform:scale(1)}
.plant.pop .bloom{animation:growPop .8s ease-out}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
/* zvieratká: nohy sa hýbu len pri chôdzi; v pokoji sa len pasú, kopú, mávajú chvostom alebo nakláňajú tykadlá */
.walker{position:absolute}
.walker .flip{width:100%}
.walker svg{display:block;width:100%;height:auto;overflow:visible}
.walker.walking .la{animation:legA var(--gait,.6s) ease-in-out infinite alternate}
.walker.walking .lb{animation:legB var(--gait,.6s) ease-in-out infinite alternate}
.walker.walking .body{animation:bodyBob calc(var(--gait,.6s) * 2) ease-in-out infinite}
.walker.walking .tail{animation:tailSway calc(var(--gait,.6s) * 2) ease-in-out infinite alternate}
.walker.rest .head{animation:graze 3s ease-in-out infinite alternate}
.walker.rest .stalks{animation:wobble 2.6s ease-in-out infinite alternate}
.walker.rest .tail{animation:tailFlick 2.4s ease-in-out infinite}
.walker.rest .pa{animation:dig .5s ease-in-out infinite alternate}
@keyframes legA{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes legB{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes bodyBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
@keyframes tailSway{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
@keyframes tailFlick{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-16deg)}90%{transform:rotate(10deg)}}
@keyframes graze{from{transform:rotate(0)}to{transform:rotate(16deg)}}
@keyframes wobble{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes dig{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
/* animácie v krajine: oblaky, slnko, vlajka, fontána, vlnky, lampáš, hojdačka, sova */
.cl{animation:cdrift 26s ease-in-out infinite alternate}
.cl.c2{animation-duration:34s;animation-delay:-8s}
@keyframes cdrift{from{transform:translateX(-26px)}to{transform:translateX(26px)}}
.rays{transform-origin:500px 40px;animation:sunspin 50s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
.jet{transform-box:fill-box;transform-origin:50% 100%;animation:jet 2.2s ease-in-out infinite alternate}
.jet.j2{animation-delay:-.7s}
.jet.j3{animation-delay:-1.4s}
@keyframes jet{from{transform:scaleY(.7)}to{transform:scaleY(1.12)}}
.rip{transform-box:fill-box;transform-origin:50% 50%;animation:ripple 3.2s ease-out infinite}
.rip.r2{animation-delay:-1.6s}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.glow{transform-box:fill-box;transform-origin:50% 50%;animation:glow 2.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.25}to{opacity:.7}}
.swingseat{transform-origin:60px 26px;animation:rock 3.2s ease-in-out infinite alternate}
@keyframes rock{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.glint{animation:glint 4s ease-in-out infinite}
.glint.b{animation-delay:-2s}
@keyframes glint{0%,100%{opacity:.15}50%{opacity:.85}}
/* spoločník zalieva kvet po správnej odpovedi */
.waterer{position:absolute;z-index:5;pointer-events:none;transition:left .8s ease-in-out}
.waterer svg{display:block;width:46px;height:50px}
.waterer .can{position:absolute;right:-8px;top:-6px;font-size:20px;transform-origin:80% 90%;transition:transform .35s ease}
.waterer.pouring .can{transform:rotate(-50deg)}
.drop{position:absolute;z-index:6;pointer-events:none;font-size:14px;animation:dropFall .9s ease-in forwards}
@keyframes dropFall{0%{opacity:0;transform:translateY(-6px)}25%{opacity:1}100%{opacity:0;transform:translateY(34px)}}
/* hlásenie nad záhradou: čo sa práve deje so zalievaním */
.wchip{position:absolute;left:8px;top:8px;z-index:7;max-width:75%;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.92);font-size:14px;font-weight:800;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12);pointer-events:none}
.wchip:empty{display:none}
.wchip.fade{animation:chipOut .8s ease 3s forwards}
@keyframes chipOut{to{opacity:0}}
.spark{position:absolute;z-index:6;pointer-events:none;font-size:18px;animation:sparkUp 1.6s ease-out forwards}
@keyframes sparkUp{0%{opacity:0;transform:translateY(8px) scale(.6)}40%{opacity:1}100%{opacity:0;transform:translateY(-20px) scale(1.1)}}
/* jazierko v strede: rybka, žabka, korytnačka a labuť plávajú v ňom */
.pondb .pa{position:absolute;animation:swim 6s ease-in-out infinite alternate}
.pondb .pa svg{display:block;width:100%!important;height:auto!important}
@keyframes swim{0%{transform:translateX(-8px)}100%{transform:translateX(8px)}}
/* pomôcka rukami: desiatky sú plné páry rúk (10 prstov), jednotky sú prsty na jednom páre; bez blikania a vyskakovania */
.hands{display:flex;flex-direction:column;align-items:center;gap:6px;margin:2px 0}
.hands-num{font-size:34px;font-weight:800;color:var(--ink);line-height:1.1}
.hands-tens{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:300px;min-height:34px}
.hands-ones{display:flex;justify-content:center;min-height:44px}
.hands-tens svg,.hands-ones svg,.hbtn svg{display:block}
.hands-btns{display:flex;gap:12px;justify-content:center;margin-top:6px}
.hbtn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:120px;padding:8px 10px 6px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:var(--ink)}
.hbtn b{font-size:22px}
.hbtn i{position:absolute;top:-10px;right:-8px;min-width:30px;padding:2px 6px;border-radius:999px;background:var(--ink);color:#fff;font-style:normal;font-size:14px;font-weight:800;text-align:center}
.hbtn:disabled{opacity:.35;cursor:default}
.hands-done{font-size:18px;font-weight:800;color:#2fa36b;text-align:center}
@keyframes growPop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes bob{to{transform:translateY(-4px)}}
.fxl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:4}
.p{position:absolute;top:-16px;width:10px;height:10px;animation:fallp linear infinite}
.p.autumn{background:#e8873a;border-radius:0 60% 0 60%}
.p.winter{background:#fff;border-radius:50%;box-shadow:0 0 4px #bfe6ff}
.p.spring{background:#ff9ec8;border-radius:50% 0 50% 0}
.p.summer{width:6px;height:6px;top:auto;bottom:-10px;background:#ffe066;border-radius:50%;animation-name:rise}
@keyframes fallp{to{transform:translate(30px,420px) rotate(360deg)}}
@keyframes rise{to{transform:translateY(-420px)}}

@media (max-width:340px){ .task{font-size:36px} .shop{grid-template-columns:1fr} .frame{grid-template-columns:repeat(5,22px)} .cell{width:22px;height:22px} }
/* hlas: texty pre Laru s tlačidlom s reproduktorom */
.spkrow{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.spkbtn{flex:0 0 auto;width:64px;height:64px;min-width:60px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:30px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation}
.spkbtn:active{transform:scale(.94)}
/* rodičovský zámok: ozubené koliesko a krúžok, ktorý sa vypĺňa pri podržaní */
.gear{position:relative}
.gear .gearico{position:relative;z-index:1}
.gear .ring{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.gear .ring circle{fill:none;stroke:var(--pink);stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100}
/* potvrdenie vynulovania: „Nie“ je zvýraznené, „Áno“ je menej výrazné */
.modal{position:fixed;inset:0;background:rgba(40,25,70,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mcard{background:var(--card);color:var(--ink);border-radius:22px;box-shadow:var(--shadow);padding:22px;max-width:360px;width:100%;text-align:center}
.mbtns{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.mbtns .bigbtn{margin-top:0}
.confirmyes{border:0;background:transparent;color:var(--muted);font-size:14px;padding:8px;cursor:pointer}
/* vynulovanie: sivé a menej výrazné tlačidlo */
.resetbtn{border:0;border-radius:999px;background:var(--line);color:var(--muted);font-size:13px;font-weight:600;padding:8px 16px;cursor:pointer;opacity:.85}
/* krok 02: voľby, bodky, krokodíl, číselná os, slovné úlohy s obrázkami, písanie číslic */
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:14px auto;max-width:520px}
.choices button{min-width:74px;min-height:74px;padding:0 14px;font-size:34px;font-weight:800;border-radius:20px;border:0;background:var(--card);color:var(--ink);box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}
.choices button:active{transform:scale(.95)}
.choices button:disabled{opacity:.35;cursor:default}
.obj-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px auto;max-width:460px}
.obj{min-width:62px;min-height:62px;font-size:40px;line-height:1;border-radius:16px;border:2px solid transparent;background:transparent;cursor:pointer;touch-action:manipulation}
.obj.counted{border-color:var(--green);background:rgba(120,220,160,.18)}
.dots{display:inline-grid;grid-template-columns:repeat(3,16px);gap:8px;justify-content:center;margin:6px auto}
.dots i{display:block;width:16px;height:16px;border-radius:50%;background:var(--ink)}
.cmpline{display:flex;align-items:flex-end;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px auto}
.cmpline .cn{display:flex;flex-direction:column;align-items:center;font-size:64px;font-weight:800}
.cmpline .q{font-size:64px;font-weight:800;min-width:1ch}
.croc{display:inline-block;width:150px;height:72px;vertical-align:middle}
.croc svg{width:100%;height:100%;overflow:visible}
.croc.face-left svg{transform:scaleX(-1)}
.croc .jaw{transition:transform .5s ease;transform-origin:70px 34px}
.croc.open .jaw{transform:rotate(-26deg)}
.nl{display:flex;flex-wrap:wrap;justify-content:center;max-width:720px;margin:12px auto}
.nl-tick{position:relative;flex:0 0 62px;height:90px;border:0;border-radius:14px;background:transparent;cursor:pointer;touch-action:manipulation}
.nl-tick::before{content:"";position:absolute;left:50%;top:6px;width:4px;height:30px;margin-left:-2px;background:var(--ink);border-radius:2px}
.nl-tick b{position:absolute;left:0;right:0;bottom:0;font-size:20px;text-align:center;color:var(--ink)}
.nl-tick.hit{background:rgba(120,220,160,.2);border-radius:14px}
.wp{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px auto}
.wp-scene{font-size:50px;line-height:1}
.wp-items{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:320px}
.wp-items span{font-size:36px;line-height:1.1;transition:opacity .4s}
.wp-items .tap{cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.wp-items .faded{opacity:.22;animation:none}
.wp-total{display:flex;align-items:center;justify-content:center;min-width:60px;height:60px;padding:0 10px;border-radius:30px;background:rgba(255,255,255,.7);font-size:34px;font-weight:800}
.wstage{width:min(300px,80vw);aspect-ratio:1/1;margin:8px auto}
#wsvg{width:100%;height:100%;display:block;background:var(--card);border-radius:22px;box-shadow:var(--shadow);touch-action:none}
.wguide{fill:none;stroke:#c9c3dc;stroke-width:12;stroke-dasharray:14 12;stroke-linecap:round;stroke-linejoin:round}
.wstart{fill:#4ac27a}
.warrow{fill:#c9c3dc}
.wink{fill:none;stroke:var(--pink);stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
.wbtns{display:flex;justify-content:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.wbtns .chip{min-width:60px;min-height:60px;padding:0 22px;font-size:20px}
.cmpans{text-align:center;min-height:70px;margin-top:6px}
.cmpans .q{font-size:56px;font-weight:800}
.qbig2{font-size:44px;font-weight:800;text-align:center;margin:8px auto}
.dicebox{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:center;min-height:170px;margin:12px auto;transition:opacity .4s}
.dicebox.dothidden{opacity:0}
.dice{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:8px;padding:14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.dice i{width:34px;height:34px;border-radius:50%}
.dice i.on{background:var(--ink)}
.wp-items .pl{font-size:40px;font-weight:800;padding:0 6px}
.fruit,.fruitgone{position:absolute;right:-10px;top:-10px;z-index:3;min-width:60px;min-height:60px;display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;touch-action:manipulation;animation:pulse 1.6s ease-in-out infinite}
.fruitgone{animation:fly .6s ease-in forwards;pointer-events:none}   /* plod, ktorý Lara práve zobrala: zmizne */
.plusfruit{position:absolute;right:-14px;top:-34px;z-index:4;font-size:26px;font-weight:800;color:#e0a100;pointer-events:none;animation:up 1.2s forwards}
/* pozadie krajiny a dekorácie len kreslia; dotyk má ísť na záhony a na plod */
#land, #fxl { pointer-events: none; }
.plot .fruit { pointer-events: auto; }   /* plod sa musí dať ťuknúť, aj keď je záhon bez dotyku */
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<div id="fx"></div>

<div class="wrap">
  <header class="top">
    <button class="icon" id="homeBtn" aria-label="Home">🏠</button>
    <button class="icon" id="soundBtn" aria-label="Sound">🔊</button>
    <div class="stars">⭐ <b id="starsTop">0</b></div>
    <button class="icon txt" id="langBtn" aria-label="Language"></button>
    <button class="icon gear" id="gearBtn" type="button" aria-label="Parents"><span class="gearico">⚙️</span><svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle id="gearRing" cx="22" cy="22" r="20" pathLength="100"/></svg></button>
  </header>

  <!-- DOMOV -->
  <section id="home" class="screen">
    <h1 id="hello">Hi!</h1>
    <p class="sub" data-t="sub"></p>
    <div class="duo"><span class="lara" id="laraBig"></span><span class="mascot" id="mascotBig" title="Tap me">🦄</span></div>
    <button class="bigbtn" id="startBtn" data-t="play"></button>
    <button class="bigbtn alt" id="writeBtn" data-t="writeBtn"></button>
    <button class="bigbtn alt" id="shopBtn" data-t="shop"></button>

    <div class="card">
      <div class="label" data-t="myGarden"></div>
      <div id="homeGarden">
        <div class="gscene" id="scene">
          <div class="wchip" id="wchip"></div>
          <div id="land"></div>
          <div id="decor"></div>
          <div class="fxl" id="fxl"></div>
        </div>
      </div>
      <div class="tip" id="gardenCount"></div>
    </div>

    <div class="card">
      <div class="label" data-t="myPet"></div>
      <div class="chips" id="mascots"></div>
      <div class="label" data-t="whatWeCount"></div>
      <div class="chips" id="types">
        <button class="chip" data-type="pm">X ± Y = ?</button>
        <button class="chip" data-type="fill">X ± ? = Y</button>
        <button class="chip" data-type="cmp">&gt; &lt; =</button>
        <button class="chip" data-type="num" data-t="numbersType"></button>
        <button class="chip" data-type="mix" data-t="typesAll"></button>
      </div>
      <div class="label" data-t="upToLabel"></div>
      <div class="chips" id="levels">
        <button class="chip" data-level="5"></button>
        <button class="chip" data-level="10"></button>
        <button class="chip" data-level="20n"></button>
        <button class="chip" data-level="20c"></button>
        <button class="chip" data-level="50"></button>
        <button class="chip" data-level="100"></button>
        <button class="chip" id="autoBtn"></button>
      </div>
      <div class="label" data-t="seasonLabel"></div>
      <div class="chips" id="seasons">
        <button class="chip" data-season="auto" data-t="seasonAuto"></button>
        <button class="chip" data-season="spring" data-t="spring"></button>
        <button class="chip" data-season="summer" data-t="summer"></button>
        <button class="chip" data-season="autumn" data-t="autumn"></button>
        <button class="chip" data-season="winter" data-t="winter"></button>
      </div>
    </div>
  </section>

  <!-- RODIČOVSKÝ ZÁMOK: štatistiky, najčastejšie chyby, nastavenia, záloha a vynulovanie -->
  <section id="parent" class="screen hidden">
    <h1 data-t="parentTitle"></h1>
    <p class="sub" data-t="parentSub"></p>
    <div class="card">
      <div class="stats">
        <div><b id="sRight">0</b><span data-t="correct"></span></div>
        <div><b id="sAcc">–</b><span data-t="accuracy"></span></div>
        <div><b id="sRounds">0</b><span data-t="rounds"></span></div>
        <div><b id="sStreak">0</b><span data-t="bestStreak"></span></div>
      </div>
      <div class="label" data-t="toPractice"></div>
      <div class="tip" id="weak"></div>
    </div>
    <div class="card">
      <div style="text-align:center;margin-top:18px">
        <button class="resetbtn" id="resetBtn" type="button" data-t="reset"></button>
      </div>
    </div>
    <div class="card" id="backupCard">
      <div class="label" data-t="backupTitle"></div>
      <div style="text-align:center"><button class="chip" id="backupBtn" data-t="backupShow"></button></div>
      <div id="backupBox" class="hidden">
        <p class="tip" data-t="backupCopyHint"></p>
        <textarea id="backupOut" readonly rows="4" style="width:100%;font-size:12px"></textarea>
        <div style="text-align:center;margin-top:8px"><button class="chip" id="backupCopy" data-t="backupCopyBtn"></button></div>
        <p class="tip" data-t="backupRestoreHint"></p>
        <textarea id="backupIn" rows="3" style="width:100%;font-size:12px"></textarea>
        <div style="text-align:center;margin-top:8px"><button class="chip" id="backupRestore" data-t="backupRestoreBtn"></button></div>
        <p class="tip" id="backupMsg"></p>
      </div>
    </div>
    <button class="bigbtn alt" id="parentBack" type="button" data-t="parentBack"></button>
  </section>

  <!-- PÍŠEME ČÍSLA: obťahovanie číslic prstom -->
  <section id="write" class="screen hidden">
    <h1 data-t="writeTitle"></h1>
    <p class="sub" data-t="writeSub"></p>
    <div class="card" style="text-align:center">
      <div class="wstage"><svg id="wsvg" viewBox="0 0 300 300" role="img" aria-label="číslica"></svg></div>
      <div class="wbtns">
        <button class="chip say" id="writeSay" type="button" data-t="speakBtn"></button>
        <button class="chip" id="writeClear" type="button" data-t="writeClear"></button>
      </div>
      <div class="tip" id="writeMsg"></div>
    </div>
    <button class="bigbtn alt" id="writeBack" type="button" data-t="writeBack"></button>
  </section>

  <!-- HRA -->
  <section id="play" class="screen hidden">
    <div class="card" style="text-align:center">
      <div class="track"><div class="progress" id="progress"></div><span class="rider" id="rider"></span></div>
      <div class="rowtop">
        <span class="mascotP" id="mascotP">🦄</span>
        <span class="tip" id="streakTxt"></span>
      </div>
      <div class="story hidden" id="story"></div>
      <div class="task" id="task"></div>
      <button class="chip say" id="sayBtn" data-t="speakBtn"></button>
      <div class="hint" id="hint"></div>
      <div class="feedback" id="fb"></div>
      <div class="pad" id="pad">

        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="del" class="del">⌫</button><button data-k="0">0</button><button data-k="ok" class="ok">✓</button>
      </div>
      <div class="cmp hidden" id="cmpBtns">
        <button data-s="&lt;">&lt;</button><button data-s="=">=</button><button data-s="&gt;">&gt;</button>
      </div>
      <div class="choices hidden" id="choiceBtns"></div>
      <button class="bigbtn hidden" id="nextBtn"></button>
    </div>
  </section>

  <!-- VÝSLEDOK KOLA -->
  <section id="done" class="screen hidden">
    <div class="card" style="text-align:center">
      <span class="mascot" id="doneMascot">🏆</span>
      <h1 data-t="roundDone"></h1>
      <p class="sub" id="doneMsg"></p>
      <div class="stats" style="margin-top:14px">
        <div><b id="dOk">0</b><span data-t="correct"></span></div>
        <div><b id="dStars">+0</b><span data-t="stars"></span></div>
      </div>
      <p class="tip" id="doneHint"></p>
    </div>
    <div class="card" style="text-align:center">
      <p class="tip" id="doneWater"></p>
      <div id="doneGarden"></div>
    </div>
    <button class="bigbtn" id="againBtn" data-t="nextRound"></button>
    <button class="bigbtn alt" id="backHomeBtn" data-t="home"></button>
  </section>

  <!-- OBCHOD -->
  <section id="shop" class="screen hidden">
    <h1 data-t="shopTitle"></h1>
    <p class="sub" id="shopSub"></p>
    <div class="label" data-t="shopCompanions"></div>
    <div class="card"><div class="shop" id="companionGrid"></div></div>
    <div class="label" data-t="shopRewards"></div>
    <div class="card"><div class="shop" id="shopGrid"></div></div>
    <p class="tip" id="shopMsg"></p>
    <button class="bigbtn alt" id="shopBack" data-t="back"></button>
  </section>
<div id="confirmBox" class="modal hidden" role="dialog" aria-modal="true">
  <div class="mcard">
    <p id="confirmTxt"></p>
    <div class="mbtns">
      <button class="bigbtn" id="confirmNo" type="button"></button>
      <button class="confirmyes" id="confirmYes" type="button"></button>
    </div>
  </div>
</div>
</div>

function tone(f, t, d, type = 'sine', v = 0.18) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const s = ac.currentTime + t;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(v, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(g); g.connect(ac.destination);
    o.start(s); o.stop(s + d + 0.05);
  } catch (e) {}
}

function trimClip(buf) {
  try {
    const ctx = getCtx();
    if (!ctx) return buf;
    const ch = buf.getChannelData(0);
    // hlasitosť po 20 ms oknách (RMS), aby jednotlivé šumy na konci nepredĺžili nahrávku
    const win = Math.max(1, Math.floor(buf.sampleRate * 0.02));
    const rms = [];
    let peakR = 0;
    for (let i = 0; i < ch.length; i += win) {
      let sum = 0, n = 0;
      for (let j = i; j < Math.min(ch.length, i + win); j++) { sum += ch[j] * ch[j]; n++; }
      const r = Math.sqrt(sum / n);
      rms.push(r);
      if (r > peakR) peakR = r;
    }
    if (!peakR) return buf;
    const th = peakR * 0.03;   // nízka hranica, aby sa neorezali slabé spoluhlásky (s, ť)
    const first = rms.findIndex(r => r > th);
    if (first < 0) return buf;
    let last = rms.length - 1;
    while (last > first && rms[last] <= th) last--;
    const s = Math.max(0, first * win - Math.floor(buf.sampleRate * 0.03));
    const e = Math.min(ch.length - 1, (last + 1) * win + Math.floor(buf.sampleRate * 0.05));   // krátky dych po slove
    const out = ctx.createBuffer(buf.numberOfChannels, e - s + 1, buf.sampleRate);
    // jednotná hlasitosť: každý klip na rovnakú strednú hlasitosť (zosilnenie najviac 3×)
    let sum = 0;
    for (let i = s; i <= e; i++) sum += ch[i] * ch[i];
    const rmsAll = Math.sqrt(sum / (e - s + 1));

function loadClip(key) {

      if (b64) return getCtx().decodeAudioData(b64ToBuf(b64)).then(trimClip);
      return fetch(AUDIO_BASE + key + '.mp3')

let chainId = 0;   // rozbehnutá reťaz viet (speakList); každé iné hlásenie ju preruší
async function playSeq(keys, fallbackText, inChain) {
  if (!inChain) chainId++;
  if (!S.sound) return;
  if (!keys || !keys.length) { say(fallbackText); return; }
  const c = getCtx();
  if (!c) { say(fallbackText); return; }
  if (c.state !== 'running') {   // iPad môže byť v stave „interrupted“; čakáme najviac 0,4 s, aby sa nezasekla hra
    try { await Promise.race([c.resume(), new Promise(r => setTimeout(r, 400))]); } catch (e) {}
  }
  const id = ++seqId;
  srcs.forEach(s => { try { s.stop(); } catch (e) {} });
  srcs = [];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const bufs = await Promise.all(keys.map(k => loadClip(typeof k === 'number' ? 'n' + k : k)));
  if (id !== seqId) return;
  if (bufs.some(b => !b)) { say(fallbackText); return; }
  let t = c.currentTime + 0.05;
  bufs.forEach(b => {
    const s = c.createBufferSource();
    s.buffer = b;
    s.connect(c.destination);
    s.start(t);
    t += b.duration + 0.02;
    srcs.push(s);
  });
  // vrátime sa až keď zvuk dohrá (ďalší zvuk môže počkať na tento)
  await new Promise(r => setTimeout(r, Math.max(0, (t - c.currentTime) * 1000)));
}

function handSVG(cx, right, up) {

  const skin = '#ffe0d0', skinE = '#f0c4a8', pink = '#ff8fbf', pinkE = '#e0609a', down = '#e9e4f2', downE = '#c4bad9';
  const finger = i => {
    const on = up[i];
    const len = on ? HAND_UP[i] : 6;
    const fill = on ? pink : down, stroke = on ? pinkE : downE;
    if (i === 0) {   // palec: šikmo von od dlane
      const px = cx - s * 15, py = 40;
      return `<rect x="${px - 4.5}" y="${py - len}" width="9" height="${len}" rx="4.5" fill="${fill}" stroke="${stroke}" stroke-width="1.5" transform="rotate(${-40 * s} ${px} ${py})"/>`;
    }
    const x = cx + s * HAND_X[i];
    return `<rect x="${x - 4.5}" y="${26 - len}" width="9" height="${len + 2}" rx="4.5" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
  };
  return `<rect x="${cx - 16}" y="24" width="32" height="32" rx="12" fill="${skin}" stroke="${skinE}" stroke-width="1.5"/>` +
    [0, 1, 2, 3, 4].map(finger).join('');
}
// pár rúk: ľavá ruka má prsty 0–4, pravá 5–9; n = koľko prstov je zdvihnutých (10 = plný pár)
function handsSVG(n, w = 64) {
  const left = [0, 1, 2, 3, 4].map(i => i < n);
  const right = [0, 1, 2, 3, 4].map(i => i + 5 < n);
  return `<svg viewBox="0 0 120 60" width="${w}" height="${Math.round(w / 2)}" aria-hidden="true">${handSVG(34, false, left)}${handSVG(86, true, right)}</svg>`;
}
// rúčky počítajú pomocný príklad: pri chýbajúcom čísle je to iný príklad (? + 3 = 7 → 7 − 3), inak sama úloha
const handsTask = t => t.hands || t;
function cntState(t) {
  if (!R.cnt || R.cnt.key !== t.key) {
    R.cnt = { key: t.key, T: Math.floor(handsTask(t).a / 10), O: handsTask(t).a % 10, pT: 0, pO: 0 };   // pT, pO: koľko kúskov druhého čísla je už použitých
  }
  return R.cnt;
}
// vnútro pomôcky: veľké číslo, desiatky, jednotky a dve tlačidlá s odznakom zostávajúcich stlačení
function cntInner(t) {
  const st = cntState(t);
  const h = handsTask(t);
  const add = h.op === '+';
  const sign = add ? '+' : '−';
  const bT = Math.floor(h.b / 10), bO = h.b % 10;
  const remT = bT - st.pT, remO = bO - st.pO;
  const canT = remT > 0 && (add ? st.T < 10 : st.T > 0);
  const canO = remO > 0 && (add || st.O > 0 || st.T > 0);
  const op = add ? 'add' : 'sub';
  const badge = n => (n > 0 ? `<i>×${n}</i>` : '');
  return `<div class="hands-num">${st.T * 10 + st.O}</div>
    <div class="hands-tens">${Array.from({ length: st.T }, () => handsSVG(10, 70)).join('')}</div>
    <div class="hands-ones">${handsSVG(st.O, 96)}</div>
    <div class="hands-btns">
      <button class="hbtn" type="button" data-op="${op}" data-k="t"${canT ? '' : ' disabled'}>${handsSVG(10, 56)}<b>${sign}10</b>${badge(remT)}</button>
      <button class="hbtn" type="button" data-op="${op}" data-k="o"${canO ? '' : ' disabled'}>${handsSVG(1, 56)}<b>${sign}1</b>${badge(remO)}</button>
    </div>
    ${remT === 0 && remO === 0 ? `<div class="hands-done">${T('ctDone')}</div>` : ''}`;
}
function cntHTML(t) {
  return `<div class="hands" id="cnt">${cntInner(t)}</div>`;
}
// stlačenie tlačidla: pribudne alebo ubudne pár rúk (10) alebo jeden prst (1)
function ctPress(t, op, k) {
  const st = cntState(t);
  const h = handsTask(t);
  const add = op === 'add';
  if (k === 't') {
    if (st.pT >= Math.floor(h.b / 10)) return;
    if (add) { if (st.T >= 10) return; st.T++; } else { if (st.T <= 0) return; st.T--; }
    st.pT++;
  } else {
    if (st.pO >= h.b % 10) return;
    if (add) { st.O++; if (st.O === 10) { st.O = 0; st.T++; } }   // 10 prstov sa presunie do desiatok
    else if (st.O > 0) st.O--;
    else if (st.T > 0) { st.T--; st.O = 9; }                        // pár sa rozpadne na 10 prstov, jeden sklopíme
    else return;
    st.pO++;
  }
}
// pomôcka: desiatkový rámik pre čísla do 20, inak len text kroku
function hintHTML(t, reveal) {
  if (t.op === 'num') return `<div class="tip">${speakable(t.step, t.snd)}</div>`;
  if (t.op === 'cmp' || t.total > 20) return `<div class="tip">${speakable(t.step, stepKeysOf(t))}</div>`;
  // sčítanie a odčítanie: vždy rúčky s prstami, nie guličky; nad 10 až po „Pomôž si“
  if (t.total > 10) {
    const open = !!R.cntOpen;
    return `<div class="hintbox" data-left="${t.g1}"><button class="chip help-btn" type="button" id="helpBtn">${T(open ? 'helpHide' : 'helpBtn')}</button>` +
      (open ? cntHTML(t) : '') + `<div class="tip">${speakable(t.step, stepKeysOf(t))}</div></div>`;
  }
  R.cntOpen = true;   // do 10 sú rúčky hneď, bez tlačidla
  return `<div class="hintbox" data-left="${t.g1}">${cntHTML(t)}<div class="tip">${speakable(t.step, stepKeysOf(t))}</div></div>`;
}
/* ====== TEXTY PRE LARU S TLAČIDLOM S REPRODUKTOROM ======
   Text sa prehrá z nahrávok (kľúče); ak niektorá nahrávka chýba, prečíta celý text hlas zariadenia. */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const N = n => 'n' + n;   // kľúč nahrávky čísla
// text pre systémový hlas: bez emoji a šípok, aby ich hlas nečítal po názvoch
const plainSpeech = s => String(s).replace(/[\p{Extended_Pictographic}\p{Variation_Selector}]/gu, '').replace(/→/g, ', ').replace(/·/g, '. ').replace(/\s+/g, ' ').replace(/\s+([,.!?:])/g, '$1').trim();
// hlas Lary: vety za sebou; ďalšia sa rozbehne, až keď sa predchádzajúca dohrá, a len ak ju nič nepreruší
function speakList(items) {
  const mine = ++chainId;
  // medzi vetami krátka prirodzená pauza (0,5 s), aby sa koniec vety dal rozpoznať
  return items.reduce((p, [keys, text], i) => p.then(() => (mine === chainId ? playSeq(keys, text, true) : null)).then(() => (i < items.length - 1 && mine === chainId ? new Promise(r => setTimeout(r, 500)) : null)), Promise.resolve()).catch(() => {});
}

const dropsKeys = n => (LANG === 'sk' ? ['tvojespravne', N(n)] : ['yourcorrect', N(n)]);
const boughtKeys = id => (LANG === 'sk' ? ['masnovuodmenu', 'odm_' + id] : ['newreward', 'odm_' + id]);
const gardenKeys = () => (LANG === 'sk' ? ['semiacko', 'vyhonok', 'kvitne', 'kazdaspravna'] : ['seed', 'sprout', 'blooms', 'everycorrect']);
const capyKeys = () => (LANG === 'sk' ? ['kapybara'] : ['capybara']);
const MASC_PLANTS = ['tulip', 'poppy', 'watermelon'];   // mená s mužským rodom: „zasadený“, „ho“

// kľúče nahrávok pre nápovedu k úlohe (slovenská aj anglická verzia)
function stepKeysOf(t) {
  const SK = LANG === 'sk';
  if (t.op === 'cmp') return t.a === t.b ? [SK ? 'cislarovnake' : 'samenumbers'] : [SK ? 'vacsiecislo' : 'biggernumber', N(Math.max(t.a, t.b))];
  if (t.op === '+' && t.mi === 1) return SK ? ['kolkotreba', N(t.b), 'abyto', N(t.total)] : ['howmuch', 'addto', N(t.b), 'tomake', N(t.total)];
  if (t.op === '+' && t.mi === 2) return SK ? ['zacni', N(t.a), 'pocitajkym', N(t.total)] : ['startat', N(t.a), 'andcountonuntil', N(t.total)];
  if (t.op === '−' && t.mi === 2) return SK ? ['od', N(t.a), 'uberajkym', N(t.g1)] : ['startat', N(t.a), 'andtakeawayuntil', N(t.g1)];
  if (t.op === '+') return SK ? ['zacni', N(t.a), 'pocitajdalej', N(t.b)] : ['startat', N(t.a), 'andcounton', N(t.b)];
  return SK ? ['zacni', N(t.a), 'odpocitaj', N(t.b)] : ['startat', N(t.a), 'andtakeaway', N(t.b)];
}
// porovnanie: odpoveď sa povie slovom (menšie, väčšie, rovné), na obrazovke ostáva znak
const CMP_KEY = { '<': ['mensie', 'smaller'], '>': ['vacsie', 'bigger'], '=': ['rovne', 'equal'] };
const CMP_TXT = { '<': ['menšie', 'smaller'], '>': ['väčšie', 'bigger'], '=': ['rovné', 'equal'] };
function answerKeys(ans) {
  if (CMP_KEY[ans]) return [LANG === 'sk' ? 'vysledok' : 'theanswer', CMP_KEY[ans][LANG === 'sk' ? 0 : 1], LANG === 'sk' ? 'nevadi' : 'noworries'];
  return LANG === 'sk' ? ['vysledok', N(ans), 'nevadi'] : ['theanswer', N(ans), 'noworries'];
}
function streakKeys(n, b) { return LANG === 'sk' ? [N(n), 'zasebou', 'bonus', N(b)] : [N(n), 'inarow', 'bonus', N(b)]; }
// nahrávky čísel sú len do 100: 101 až 199 povieme ako „sto …“, pri 200 a viac hovoríme bez čísla
function needKeys(n) {
  const num = n <= 100 ? [N(n)] : n < 200 ? ['n100', N(n - 100)] : [];
  return LANG === 'sk' ? ['este', ...num, 'chyba', 'hrajdalej'] : [...num, 'morestarsneeded', 'keepplaying'];
}
// veta o úrovni: predpona + „do“ + číslo + prípadný dodatok o prechode cez desiatku
function lvKeys(prefix, id) {
  const st = STAGES[STAGE_IDS.indexOf(id)] || STAGES[1];
  const extra = id === '20n' ? (LANG === 'sk' ? ['bezprechodu'] : ['nocrossing']) : id === '20c' ? (LANG === 'sk' ? ['sprechodom'] : ['withcrossing']) : [];
  return prefix.concat(LANG === 'sk' ? ['do'] : ['upto'], [N(st.max)], extra);
}

  // dvojciferné úlohy: tlačidlo „Pomôž si“ je k dispozícii hneď, ostatné nápovedy až po chybe
  const twoDigit = (R.t.op === '+' || R.t.op === '−') && R.t.mi === 0 && R.t.total > 20;

  $('#cmpBtns').classList.toggle('hidden', !isCmp);

  updateAns();
  renderProgress();
  // úloha sa ozve až po pochvale (ak sa pochvala hrá); inak hneď
  const task = R.t;
  const go = () => { if (R && R.t === task) playSeq(task.snd, task.story || task.speak); };
  if (after) after.then(go); else go();

// spoločník pokračuje po číselnej osi: pozícia zodpovedá počtu správnych odpovedí v kole

function check() {

  R.tries++;

    SFX.oops();
    bump($('#mascotP'), 'sad');

function win() {

  streak++;

  gain(first ? CONFIG.STARS_FIRST_TRY : CONFIG.STARS_SECOND_TRY);
  let msg = first ? T('great') : T('correctSecond');
  let said = null;   // správa, ktorú Lara povie nahlas aj s tlačidlom: [kľúče, text]
  if (streak % CONFIG.STREAK_EVERY === 0) {
    gain(CONFIG.STREAK_BONUS);
    said = [streakKeys(streak, CONFIG.STREAK_BONUS), T('streakMsg', { n: streak, b: CONFIG.STREAK_BONUS })];

  } else { SFX.ok(); confetti(8); }

  S.stats.total++;

  bump($('#mascotP'), 'sad');
  R.input = String(R.t.ans); updateAns();
  gain(CONFIG.STARS_EFFORT);

  if (R.t.op === 'cmp') { revealCroc(R.t); items.push(cmpSpeech(R.t)); }   // krokodíl ukáže väčšie číslo a povie sa veta

  else { msg = T('good'); mk = 'good'; }

      levelMsg = T('levelUp', { lv: T('lv_' + S.level) });
      levelKeys = lvKeys(LANG === 'sk' ? ['tak', 'teraz', 'pocitame'] : ['amazing', 'nowwecount'], S.level);
    } else if (R.ok <= 4 && i > 0) {
      S.level = STAGE_IDS[i - 1];
      levelMsg = T('levelDown', { lv: T('lv_' + S.level) });
      levelKeys = lvKeys(LANG === 'sk' ? ['idemepomalsie', 'pocitame'] : ['letsgoslower', 'wecount'], S.level);
    }
  }

  S.rounds++;
  const capy = S.mascot === 'capybara' && S.rounds % 3 === 0;   // kapybara pripomína prestávku
  save();
  const cheapest = Math.min(...STICKERS.filter(s => !S.unlocked.includes(s.id)).map(s => s.price), Infinity);
  const shopMsg = S.stars >= cheapest ? T('shopHint') : '';
  const capyMsg = capy ? T('capyBreak') : '';
  $('#doneMascot').innerHTML = mascotSVG(S.mascot, 110, 'idle');
  $('#doneMsg').innerHTML = speakable(msg, [mk]);
  $('#dOk').textContent = `${R.ok}/${CONFIG.ROUND_LENGTH}`;
  $('#dStars').textContent = `+${R.gained}`;
  $('#doneHint').innerHTML = [levelMsg && speakable(levelMsg, levelKeys), shopMsg && speakable(shopMsg, ['shophint']), capy && speakable(capyMsg, capyKeys())].filter(Boolean).join(' ');
  $('#doneWater').innerHTML = R.ok ? speakable(T('dropsGot', { n: R.ok }), dropsKeys(R.ok)) : '';
  SFX.win(); confetti(25);
  // výsledok a ďalšie správy zaznejú za sebou, v rovnakom poradí ako na obrazovke
  const items = [[[mk], msg]];
  if (R.ok) items.push([dropsKeys(R.ok), T('dropsGot', { n: R.ok })]);
  if (levelMsg) items.push([levelKeys, levelMsg]);
  if (shopMsg) items.push([['shophint'], shopMsg]);
  if (capy) items.push([capyKeys(), capyMsg]);
  speakList(items);
  renderHome();
  show('done');
}

const GROW_NAME = { sk: ['Semiačko', 'Výhonok', 'Rastlina', 'Kvitne'], en: ['Seed', 'Sprout', 'Plant', 'Blooming'] };
// semiačko: hrudka zeme a prvé lístky (rovnaké pre každú rastlinu)
const SEED_SVG = `<svg viewBox="0 0 120 120" aria-hidden="true">

let POUR = null;   // zalievanie, ktoré práve beží: { total, timer }
function plantsOwned() { return S.unlocked.map(id => STICKERS.find(s => s.id === id)).filter(s => s && s.tier === 1); }
// kam ide ďalšia kvapka: najmenej vyrastená rastlina, ktorá ešte nekvitne (pri rovnosti podľa poradia na záhone)
function dropTarget(plants, taken = []) {
  const open = plants.filter(s => (S.grow[s.id] || 0) < 3 && !taken.includes(s.id));
  return open.sort((a, b) => (S.grow[a.id] || 0) - (S.grow[b.id] || 0) || plants.indexOf(a) - plants.indexOf(b))[0] || null;

// kvapky padajú z konvičky na kvet
function dropsFall(scene, cx, cy) {

}
// spoločník prejde ku kvetu; keď naklopí konvičku, kvapky padnú a rastlina sa ukáže o fázu vyššie
function pourAt(s, scene) {
  const plot = document.querySelector(`#album .plot[data-id="${s.id}"]`);
  if (!plot) return;
  const sr = scene.getBoundingClientRect(), pr = plot.getBoundingClientRect();
  const left = pr.left - sr.left, top = pr.top - sr.top;
  const w = document.createElement('div');
  w.className = 'waterer';
  w.style.left = (left - 60) + 'px';
  w.style.top = (top - 18) + 'px';
  w.innerHTML = mascotSVG(S.mascot, 46) + '<span class="can">💧</span>';
  scene.appendChild(w);
  requestAnimationFrame(() => requestAnimationFrame(() => { w.style.left = (left + pr.width * 0.3) + 'px'; }));
  setTimeout(() => {
    w.classList.add('pouring');
    dropsFall(scene, left + pr.width / 2, top + pr.height * 0.5);
    setPlantStage(plot, S.grow[s.id] || 0, true);
  }, 850);
  setTimeout(() => w.remove(), 1700);
}
// zalievanie raz za kolo (po 10 úlohách): spoločník príde raz a zaleje všetky kvapky z kola naraz
function runWatering() {
  if (POUR || !S.water) return;
  const plants = plantsOwned();
  if (!plants.length) { setChip(T('waterNeedPlant')); return; }   // kvapky počkajú na prvú rastlinu
  const scene = $('#scene');
  const total = S.water;
  POUR = { total, timer: null };
  // jedna návšteva: spoločník pri kvete naklopí konvičku a kvapky dopadnú naraz
  pourAt(plants.find(s => (S.grow[s.id] || 0) < 3) || plants[0], scene);
  if (S.mascot === 'unicorn') sparkles(scene);   // jednorožec zanechá iskričky
  POUR.timer = setTimeout(() => {   // stav sa zmení tesne pred dopadom, aby rastlina ukázala novú fázu
    if (!POUR) return;
    const taken = [];
    let fruit = false;
    for (let k = 0; k < total; k++) {   // jedno zalievanie = najviac jeden stupeň na rastlinu; kvapka navyše sa minie
      const s = dropTarget(plants, taken);
      if (s) { taken.push(s.id); S.grow[s.id] = (S.grow[s.id] || 0) + 1; }
      else if (dropFruit(plants)) fruit = true;   // všetky rastliny kvitnú: kvitnúca rastlina bez plodu dostane plod
      else sparkles(scene);   // kvapka sa len vsiakne
    }
    S.water = 0;
    save();
    finishWatering(total, fruit);
  }, 800);
}
// iskričky: jednorožec ich zanecháva a aj kvety, ktoré už kvitnú
function sparkles(scene) {
  for (let i = 0; i < 6; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = '✨';
    s.style.left = (10 + Math.random() * 80) + '%';
    s.style.top = (20 + Math.random() * 50) + '%';
    scene.appendChild(s);
    setTimeout(() => s.remove(), 1800);
  }
}
// kvapka na rastline, ktorá už kvitne: vznikne plod (najviac jeden na rastline); vráti true, ak plod vznikol
function dropFruit(plants) {
  const s = plants.find(p => (S.grow[p.id] || 0) >= 3 && !S.fruit[p.id]);
  if (s) S.fruit[s.id] = true;
  return !!s;
}
function finishWatering(total, fruit) {
  POUR = null;
  refreshStages();
  setChip(T('waterFinished', { n: total, drops: total === 1 ? 'drop' : 'drops', kv: kvapky(total) }), true);
  if (fruit) playSeq(LANG === 'sk' ? ['nakvetejeplod', 'tuknina'] : ['thereisafruit', 'tapit'], LANG === 'sk' ? 'Na kvete je plod. Ťukni naň.' : 'There is a fruit! Tap it.');
}
// keď dieťa odíde, zalievanie sa len zruší: stav sa nemení a kvapky ostanú na ďalšiu návštevu (nič sa nezaleje potichu)
function flushWatering() {
  if (!POUR) return;
  clearTimeout(POUR.timer);
  POUR = null;
  document.querySelectorAll('#scene .waterer, #scene .drop').forEach(e => e.remove());
  setChip('');
}
// dráčik zaleje celú záhradu (raz denne): každý kvet o jednu fázu
function waterAll() {
  plantsOwned().forEach(s => { S.grow[s.id] = Math.min(3, (S.grow[s.id] || 0) + 1); });
  refreshStages();
  save();
  setChip(T('dragonWatered'), true);
}

/* ====== ZVIERATKÁ V ZÁHRADE: každé má svoje tempo; chodí po chodníku, zastaví sa, pasie sa alebo kope ====== */
const critState = {};   // id -> { x, dir, moving, target, until }
let critTimer = null;
const frand = (a, b) => a + Math.random() * (b - a);
// je miesto pre stred zvieraťa také, aby sa jeho telo nedotklo prekážky?
function critFree(c, x) {
  return !(CRIT_BLOCKS[c.lane] || []).some(([a, b]) => x > a - c.w / 2 && x < b + c.w / 2);
}
function critInit(id) {
  const c = CRIT[id];
  let x;
  do { x = frand(120, 880); } while (!critFree(c, x));   // začína sa mimo prekážok
  critState[id] = { x, dir: Math.random() < 0.5 ? 1 : -1, moving: false, target: 0, until: performance.now() + frand(0, 4000) };
}
// spodok obrázka tak, aby nohy stáli presne na chodníku (v %)
function critBottom(id) {
  const c = CRIT[id];
  return ((GH - c.lane) - c.w / 30) / GH * 100;
}
// obrázok zvieraťa; kreslí sa doprava, otočenie doľava je prevrátenie
function critFlip(id, dir) { return `<div class="flip" style="transform:${dir < 0 ? 'scaleX(-1)' : ''}">${itemSVG(id, 100)}</div>`; }
function critTick() {
  const now = performance.now();
  Object.keys(critState).forEach(id => {
    const c = CRIT[id], st = critState[id];
    if (st.moving) {
      const nx = st.x + st.dir * c.speed * 0.1;
      if (!critFree(c, nx)) {                   // pred prekážkou sa zvieratko zastaví a otočí
        st.moving = false;
        st.dir = -st.dir;
        st.until = now + frand(c.rest[0], c.rest[1]) * 1000;
      } else {
        st.x = nx;
        if ((st.dir > 0 && st.x >= st.target) || (st.dir < 0 && st.x <= st.target)) {
          st.x = st.target;
          st.moving = false;
          st.until = now + frand(c.rest[0], c.rest[1]) * 1000;
        }
      }
    } else if (now >= st.until) {
      if (Math.random() < c.calm) {          // zostane ešte chvíľu stáť
        st.until = now + frand(c.rest[0], c.rest[1]) * 500;
      } else {                                // vyrazí ďalej; niekedy sa otočí
        if (Math.random() < 0.25) st.dir = -st.dir;
        st.target = Math.min(960, Math.max(40, st.x + st.dir * frand(60, 260)));
        st.moving = true;
      }
    }
    const el = document.querySelector(`#walkers .walker[data-id="${id}"]`);
    if (!el) return;
    el.style.left = ((st.x - c.w / 2) / GW * 100) + '%';
    el.classList.toggle('walking', st.moving);
    el.classList.toggle('rest', !st.moving);
    el.firstElementChild.style.transform = st.dir < 0 ? 'scaleX(-1)' : '';
  });
}
function renderGarden(owned) {
  const season = currentSeason();
  $('#scene').className = 'gscene ' + season;
  $('#land').innerHTML = landSVG();
  const has = id => owned.some(s => s.id === id);
  // stavba stojí na svojom pevnom mieste; vzadu sa kreslí skôr
  const place = (s, p, cls, inner) => `<div class="${cls}" title="${sName(s)}" style="left:${(p.c - p.w / 2) / GW * 100}%;bottom:${(GH - p.b) / GH * 100}%;width:${p.w / GW * 100}%;z-index:${p.b}">${inner}</div>`;
  let decor = owned.filter(s => s.tier === 3 && s.id !== 'pond')
    .sort((a, b) => SLOT[a.id].b - SLOT[b.id].b)
    .map(s => place(s, SLOT[s.id], 'bld', itemSVG(s.id, 100))).join('');
  if (has('pond')) {   // jazierko stojí v strede pred zámkom; plávajú v ňom žabka, korytnačka, rybka a labuť
    const kids = owned.filter(s => POND_ANIMALS.includes(s.id))
      .map(s => `<span class="pa" title="${sName(s)}" style="${POND_POS[s.id]}">${itemSVG(s.id, 60)}</span>`).join('');
    decor += place(owned.find(s => s.id === 'pond'), SLOT.pond, 'bld pondb', itemSVG('pond', 170) + kids);
  }
  if (has('owl')) decor += place(owned.find(s => s.id === 'owl'), OWL_SLOT, 'bld', itemSVG('owl', 100));   // sova na veži
  decor += owned.filter(s => s.tier === 4).map(s => {
    const p = SLOT[s.id];
    return `<div class="sky" title="${sName(s)}" style="left:${(p.c - p.w / 2) / GW * 100}%;top:${(p.y - p.w / 2) / GH * 100}%;width:${p.w / GW * 100}%">${itemSVG(s.id, 100)}</div>`;
  }).join('');
  const decorHTML = decor;
  // záhony: rastlina sa objaví na svojom mieste ako semiačko a podľa zálievania rastie
  const plotsHTML = owned.filter(s => s.tier === 1 && BEDS[s.id]).map((s, i) => {
    const [cx, cy] = BEDS[s.id];
    const g = S.grow[s.id] || 0;
    return `<div class="plot" data-id="${s.id}" title="${sName(s)} · ${GROW_NAME[LANG][g]}" style="left:${(cx - 56) / GW * 100}%;top:${(cy - 41) / GH * 100}%;z-index:${Math.round(cy + 41)}">` +
      `<span class="plant g${g}" style="animation-delay:${-(i % 5) * 0.7}s"><span class="seedling">${SEED_SVG}</span><span class="bloom">${itemSVG(s.id, 110)}</span></span></div>`;
  }).join('');
  // zvieratká: ich stav sa drží aj pri prekreslení, takže sa nezaseknú; chodia po chodníkoch
  const walkers = owned.filter(s => CRIT[s.id]);
  Object.keys(critState).forEach(id => { if (!walkers.some(s => s.id === id)) delete critState[id]; });
  const walkersHTML = walkers.map(s => {
    const c = CRIT[s.id];
    if (!critState[s.id]) critInit(s.id);
    const st = critState[s.id];
    return `<div class="walker ${st.moving ? 'walking' : 'rest'}" data-id="${s.id}" style="width:${c.w / GW * 100}%;left:${(st.x - c.w / 2) / GW * 100}%;bottom:${critBottom(s.id)}%;z-index:${c.lane};--gait:${c.gait}s">${critFlip(s.id, st.dir)}</div>`;
  }).join('');
  // stavby, záhony a zvieratká sú v jednej vrstve: vyššie stanovište (menšia hodnota y) sa kreslí skôr
  $('#decor').innerHTML = decorHTML + `<div id="album">${plotsHTML}</div><div id="walkers">${walkersHTML}</div>`;
  if (!critTimer) critTimer = setInterval(critTick, 100);
  $('#fxl').innerHTML = Array.from({ length: 10 }, (_, i) =>
    `<i class="p ${season}" style="left:${(i * 37) % 100}%;animation-delay:${-(i * 1.7)}s;animation-duration:${(season === 'summer' ? 7 : 9) + (i % 4) * 2}s"></i>`).join('');
  refreshFruit();
  $('#gardenCount').innerHTML = speakable(T('gardenLegend'), gardenKeys());
}

});

    S = Object.assign(defaults(), data);

$('#companionGrid').onclick = e => {
  const b = e.target.closest('[data-comp]');
  if (!b) return;
  const m = MASCOTS.find(x => x.id === b.dataset.comp);
  if (S.companions.includes(m.id)) { S.mascot = m.id; save(); renderShop(); renderHome(); return; }
  if (S.stars < m.price) {
    SFX.oops();
    const txt = T('needMore', { n: m.price - S.stars }), keys = needKeys(m.price - S.stars);
    $('#shopMsg').innerHTML = speakable(txt, keys);
    playSeq(keys, txt);

  }
  S.stars -= m.price;
  S.companions.push(m.id);

  save(); SFX.ok(); confetti(12);
  renderShop(); renderTop();
  const boughtTxt = T('bought', { name: mName(m) });

    $('#shopMsg').innerHTML = speakable(txt, keys);

  S.stars -= s.price;
  S.unlocked.push(s.id);

  save(); SFX.ok(); confetti(12);
  renderShop(); renderTop();   // prekreslenie obchodu vymaže správu, preto sa nastaví až potom

  const soldKeys = s.tier === 1 ? plantedKeys(s) : boughtKeys(s.id);
  $('#shopMsg').innerHTML = speakable(soldTxt, soldKeys);
  playSeq(soldKeys, soldTxt);
};

/* ====== RODIČOVSKÝ ZÁMOK: ozubené koliesko sa otvorí až po podržaní 3 sekundy; počas držania sa vypĺňa krúžok ====== */
const GEAR = { raf: null, start: 0 };
function gearRelease() {
  if (GEAR.raf) cancelAnimationFrame(GEAR.raf);
  GEAR.raf = null;
  $('#gearRing').style.strokeDashoffset = '100';
}
function gearPress(e) {
  e.preventDefault();
  gearRelease();
  GEAR.start = performance.now();
  const tick = () => {
    const p = Math.min(1, (performance.now() - GEAR.start) / 3000);
    $('#gearRing').style.strokeDashoffset = String(100 * (1 - p));
    if (p >= 1) { gearRelease(); show('parent'); return; }
    GEAR.raf = requestAnimationFrame(tick);
  };
  GEAR.raf = requestAnimationFrame(tick);
}
$('#gearBtn').addEventListener('pointerdown', gearPress);
['pointerup', 'pointerleave', 'pointercancel'].forEach(t => $('#gearBtn').addEventListener(t, gearRelease));
$('#gearBtn').addEventListener('contextmenu', e => e.preventDefault());
