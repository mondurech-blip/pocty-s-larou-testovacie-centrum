<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lara Math">
<meta name="theme-color" content="#b38cff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Math with Lara</title>
<script>
// diagnostika: ak sa niečo pokazí, chyba sa zobrazí dole na stránke
window.addEventListener('error', function (e) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;bottom:0;background:#ffdede;color:#600;padding:10px;font:13px sans-serif;z-index:99999;word-break:break-all';
  d.textContent = 'CHYBA: ' + (e.message || 'neznáma') + ' (riadok ' + (e.lineno || '?') + ')';
  (document.body || document.documentElement).appendChild(d);
});
</script>
<style>
:root{
  --bg1:#fdf0ff; --bg2:#e2f3ff; --card:#ffffff; --ink:#3b2a5a; --muted:#8c7fa8;
  --pink:#ff7eb6; --purple:#b38cff; --blue:#6cb8ff; --yellow:#ffc83d; --green:#44c48a; --red:#ff7a6b;
  --line:#e6dcf5; --shadow:0 10px 30px rgba(90,60,150,.15);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1d44; --bg2:#15283f; --card:#35295c; --ink:#f4eeff; --muted:#b7a8d6;
    --line:#4a3c75; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg1:#2a1d44; --bg2:#15283f; --card:#35295c; --ink:#f4eeff; --muted:#b7a8d6;
  --line:#4a3c75; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
body{
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  min-height:100vh; background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed; color:var(--ink);
  font-family:system-ui,"Segoe UI",Roboto,sans-serif; overflow-x:hidden;
}
.hidden{display:none !important}
.wrap{max-width:460px;margin:0 auto;padding:4px 16px 40px;position:relative;z-index:1}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;padding:10px 0;z-index:5}
.icon{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);font-size:20px;cursor:pointer}
.icon.txt{font-size:14px;font-weight:800;color:var(--ink)}
.stars{background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:8px 16px;font-weight:700;font-size:18px}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin:12px 0}
h1{font-size:28px;margin:6px 0 4px;text-align:center}
.sub{color:var(--muted);text-align:center;margin:0 0 10px}
.mascot{font-size:88px;text-align:center;line-height:1.1;margin:6px 0;display:block;cursor:pointer;user-select:none}
.bigbtn{width:100%;border:0;border-radius:18px;padding:16px;font-size:20px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple));box-shadow:var(--shadow);cursor:pointer;margin-top:8px}
.bigbtn.alt{background:linear-gradient(135deg,var(--blue),#5ee0c1)}
.label{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:600;cursor:pointer}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mchip{padding:4px 8px !important;line-height:0}
.mchip svg{width:40px;height:40px;display:block;margin:0 auto}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:13px;color:var(--muted)}
.tip{color:var(--muted);font-size:16px;text-align:center;margin:4px 0}

/* hra */
.progress{display:flex;justify-content:center;gap:8px;margin:4px 0 8px;flex-wrap:wrap}
.pd{width:14px;height:14px;border-radius:50%;background:var(--line);transition:transform .2s}
.pd.ok{background:var(--green)} .pd.bad{background:var(--red)}
.pd.cur{background:var(--pink);transform:scale(1.35)}
.rowtop{display:flex;justify-content:space-between;align-items:center;min-height:64px}
.mascotP svg{width:64px;height:64px}
.story{font-size:20px;font-weight:600;line-height:1.35;margin:4px 0 8px}
.task{font-size:46px;font-weight:800;text-align:center;margin:8px 0 4px;letter-spacing:.02em}
.q{display:inline-block;min-width:1.3em;padding:0 .2em;border-radius:14px;background:var(--yellow);color:#3b2a5a;text-align:center}
.ans{font-size:40px;font-weight:800;text-align:center;min-height:66px;border:3px dashed var(--line);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:10px auto;max-width:220px}
.ans.empty{color:var(--muted)}
.hint{display:flex;flex-direction:column;align-items:center;gap:6px;margin:8px 0;min-height:24px}
.frames{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,26px);gap:5px;padding:8px;border-radius:14px;background:rgba(255,255,255,.4)}
.cell{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);position:relative;display:inline-block}
.cell.empty{border-color:transparent;background:transparent}
.cell.blue{background:var(--blue);border-color:var(--blue)}
.cell.yellow{background:var(--yellow);border-color:var(--yellow)}
.cell.gold{background:var(--yellow);border-color:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.cell.ghost{border:2px dashed var(--muted)}
.cell.out{border-color:var(--red);background:transparent}
.cell.out::after{content:'';position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:var(--red);transform:rotate(-45deg)}
.feedback{min-height:30px;text-align:center;font-size:20px;font-weight:700;margin-top:6px}
.cell.tap{cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.cell.gone{animation:fly .6s ease-in forwards;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.12)}}
@keyframes fly{to{transform:translateY(-70px) scale(.4);opacity:0}}
.tapmsg{color:var(--pink);font-weight:700}
.flrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:260px;margin:4px auto}
.fl{display:inline-block;width:34px;height:34px;transition:opacity .4s}
.fl svg{width:34px;height:34px;display:block}
.fl.tap{cursor:pointer;animation:pulse 1.6s ease-in-out infinite}
.fl.gone{animation:fly .6s ease-in forwards;pointer-events:none}
/* pomôcka pre dvojciferné čísla: desiatky (tyčinky) a jednotky (guličky) */
.help-btn{display:block;margin:0 auto 8px}
.cnt-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0}
.cnt-grp{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.75);border:2px dashed #d6c8f5;max-width:100%}
.cnt-bars{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:250px}
.cnt-dots{display:grid;grid-template-columns:repeat(5,26px);gap:6px;justify-content:center}
.cnt-item{cursor:pointer;display:inline-block;transition:opacity .2s}
.cnt-item.bar{width:18px;height:60px;border-radius:5px;border:2px solid #4f8ef7;background:repeating-linear-gradient(to bottom,#cfe2ff 0 5px,#4f8ef7 5px 6px)}
.cnt-item.dot{width:26px;height:26px;border-radius:50%;background:#ffb703;border:2px solid #d98e00}
.cnt-item.done{opacity:.3}
.cnt-op{font-size:28px;font-weight:800;color:var(--ink)}
.cnt-info{font-size:18px;font-weight:700;color:var(--ink);text-align:center}
.cnt-msg{font-size:15px;font-weight:700;color:#e0457b;text-align:center}
.fl.faded{opacity:.3}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;transition:opacity .2s}
.pad.off,.cmp.off{opacity:.4;pointer-events:none}
.pad button,.cmp button{font-size:26px;font-weight:700;padding:14px 0;border-radius:16px;border:0;background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer}
.pad button:active,.cmp button:active{transform:translateY(3px);box-shadow:none}
.pad .ok{background:var(--green);color:#fff;box-shadow:0 4px 0 #2f9e6b}
.pad .del{color:var(--muted)}
.cmp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px;transition:opacity .2s}
.cmp button{font-size:40px;font-weight:800}
.chip.say{margin-bottom:4px}

/* animácie */
.happy{animation:bounce .6s}
.sad{animation:shake .5s}
.shake{animation:shake .4s}
@keyframes bounce{30%{transform:translateY(-22px) scale(1.1)}60%{transform:translateY(0)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.plus{position:fixed;right:70px;top:64px;font-weight:800;font-size:22px;color:#e0a100;pointer-events:none;animation:up 1.2s forwards;z-index:20}
@keyframes up{to{opacity:0;transform:translateY(-60px)}}
.conf{position:fixed;top:-40px;pointer-events:none;animation:fall 2.2s ease-in forwards;z-index:20}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.deco span{position:absolute;bottom:-60px;opacity:.15;animation:float linear infinite}
@keyframes float{to{transform:translateY(-120vh)}}
.idle{animation:idle 3s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* obchod */
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.st{border:2px solid var(--line);border-radius:18px;padding:12px 8px;background:transparent;color:var(--ink);cursor:pointer;text-align:center;font-size:15px;font-weight:700}
.st .se svg{display:block;margin:0 auto;width:56px;height:56px}
.st.owned{border-color:var(--green)}
.st small{display:block;color:var(--muted);margin-top:4px;font-weight:600}
#shopMsg{min-height:24px;font-weight:700}

/* Lara a spoločník */
.duo{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin:6px 0}
.duo svg,.lara svg{display:block}
.track{position:relative;padding-top:58px}
.rider{position:absolute;bottom:22px;left:0;transform:translateX(-50%);transition:left .5s ease;pointer-events:none}
.rider svg{width:48px;height:48px;display:block}
.mascotP svg{width:64px;height:64px}
/* záhrada – scéna */
.gscene{position:relative;border-radius:22px;overflow:hidden;--s1:#b9e6ff;--s2:#eefcff;--g1:#8fd490;--g2:#68bd6e;--hill:#86cf86;--sun:#ffd36e;background:linear-gradient(180deg,var(--s1) 0,var(--s2) 190px,var(--g1) 190px,var(--g2) 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.gscene.spring{--s1:#c4eeff;--s2:#f3fff0;--g1:#a7e89a;--g2:#72c86f;--hill:#9ad994;--sun:#ffe07a}
.gscene.summer{--s1:#8fdcff;--s2:#fff7d6;--g1:#9be07a;--g2:#5fb24e;--hill:#7cc766;--sun:#ffc93c}
.gscene.autumn{--s1:#ffd3a0;--s2:#fff1dc;--g1:#e2b66a;--g2:#b9864a;--hill:#d9a25a;--sun:#ffb347}
.gscene.winter{--s1:#d6e6f7;--s2:#f5fbff;--g1:#f7fcff;--g2:#dbe9f6;--hill:#eef7ff;--sun:#fff3c4}
.gtop{position:relative;height:190px}
.sun{position:absolute;top:14px;right:18px;width:44px;height:44px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 8px rgba(255,211,110,.28),0 0 26px rgba(255,211,110,.85)}
.gscene.summer .sun{width:60px;height:60px;top:8px;right:14px;box-shadow:0 0 0 10px rgba(255,201,60,.25),0 0 30px rgba(255,201,60,.85)}
.cloud{position:absolute;height:22px;width:74px;border-radius:20px;background:#fff;opacity:.95;animation:drift 22s ease-in-out infinite alternate}
.cloud::before{content:'';position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;left:12px;top:-14px}
.cloud::after{content:'';position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;left:38px;top:-10px}
.cloud.c1{top:20px;left:12px}
.cloud.c2{top:50px;left:150px;width:56px;animation-duration:30s}
@keyframes drift{to{transform:translateX(18px)}}
.hills{position:absolute;left:0;right:0;bottom:0;height:64px;background:radial-gradient(ellipse 150px 60px at 22% 100%,var(--hill) 97%,transparent 100%),radial-gradient(ellipse 170px 70px at 82% 100%,var(--hill) 97%,transparent 100%)}
.fence{position:absolute;left:0;right:0;bottom:18px;height:34px;background:repeating-linear-gradient(90deg,#fff 0 12px,transparent 12px 26px)}
.fence::before{content:'';position:absolute;left:0;right:0;top:9px;height:6px;background:#f2dcc4;box-shadow:0 12px 0 #f2dcc4}
.house{position:absolute;right:12px;top:30px;width:132px;z-index:2}
.lamp{position:absolute;left:43%;bottom:-6px;width:28px;z-index:2}
.house svg,.lamp svg{display:block;width:100%;height:auto}
.gbot{position:relative;min-height:150px;padding:8px 12px 18px}
.path{position:absolute;left:50%;top:0;bottom:0;width:70px;margin-left:-35px;background:#f0d9a8;opacity:.55;clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
.plots{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.plot{position:relative;height:80px}
.plot::before{content:'';position:absolute;left:6%;right:6%;bottom:0;height:24px;border-radius:50%;background:#c98f5a;box-shadow:inset 0 -5px 0 #a8703f}
.plot.empty::before{background:#b98252;opacity:.5;box-shadow:none}
.plant{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%}
.plant svg{width:52px;height:52px}
.sprout{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:22px;opacity:.75}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.pond-cell{grid-column:span 2;position:relative;height:84px}
.water{position:absolute;left:2%;right:2%;top:6px;bottom:4px;border-radius:50%;background:radial-gradient(ellipse at 35% 35%,#d4f5ff 0%,#8fd8f7 50%,#5fb8e6 100%);box-shadow:0 0 0 6px #d9c3a0,0 0 0 8px #b8956a,0 8px 10px rgba(60,40,20,.2)}
.water .lily{position:absolute;width:26px;height:12px;border-radius:50%;background:#6cc98c;box-shadow:inset 0 -2px 0 #4fa878}
.water .l1{left:16%;top:46%}
.water .l2{right:18%;top:28%;width:20px;height:10px;transform:rotate(15deg)}
.water .ripple{position:absolute;left:30%;right:30%;top:36%;height:40%;border:2px solid rgba(255,255,255,.75);border-radius:50%;animation:ripple 3s ease-out infinite}
@keyframes ripple{0%{transform:scale(.4);opacity:.9}100%{transform:scale(1.4);opacity:0}}
#walkers{position:absolute;inset:0;pointer-events:none;z-index:2}
.walker{position:absolute;left:-16%;animation:walk linear infinite}
.walker svg{width:54px;height:54px;display:block;animation:bob .6s ease-in-out infinite alternate}
@keyframes walk{from{left:-16%}to{left:104%}}
@keyframes bob{to{transform:translateY(-4px)}}
.fxl{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.p{position:absolute;top:-16px;width:10px;height:10px;animation:fallp linear infinite}
.p.autumn{background:#e8873a;border-radius:0 60% 0 60%}
.p.winter{background:#fff;border-radius:50%;box-shadow:0 0 4px #bfe6ff}
.p.spring{background:#ff9ec8;border-radius:50% 0 50% 0}
.p.summer{width:6px;height:6px;top:auto;bottom:-10px;background:#ffe066;border-radius:50%;animation-name:rise}
@keyframes fallp{to{transform:translate(30px,420px) rotate(360deg)}}
@keyframes rise{to{transform:translateY(-420px)}}

@media (max-width:340px){ .task{font-size:36px} .shop{grid-template-columns:1fr} .frame{grid-template-columns:repeat(5,22px)} .cell{width:22px;height:22px} }
</style>
</head>
<body>
<div class="deco" id="deco"></div>
<div id="fx"></div>

<div class="wrap">
  <header class="top">
    <button class="icon" id="homeBtn" aria-label="Home">🏠</button>
    <div class="stars">⭐ <b id="starsTop">0</b></div>
    <button class="icon txt" id="langBtn" aria-label="Language"></button>
    <button class="icon" id="soundBtn" aria-label="Sound">🔊</button>
  </header>

  <!-- DOMOV -->
  <section id="home" class="screen">
    <h1 id="hello">Hi!</h1>
    <p class="sub" data-t="sub"></p>
    <div class="duo"><span class="lara" id="laraBig"></span><span class="mascot" id="mascotBig" title="Tap me">🦄</span></div>
    <button class="bigbtn" id="startBtn" data-t="play"></button>
    <button class="bigbtn alt" id="shopBtn" data-t="shop"></button>

    <div class="card">
      <div class="stats">
        <div><b id="sRight">0</b><span data-t="correct"></span></div>
        <div><b id="sAcc">–</b><span data-t="accuracy"></span></div>
        <div><b id="sRounds">0</b><span data-t="rounds"></span></div>
        <div><b id="sStreak">0</b><span data-t="bestStreak"></span></div>
      </div>
      <div class="label" data-t="myGarden"></div>
      <div class="gscene" id="scene">
        <div class="gtop">
          <div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div>
          <div class="hills"></div>
          <div class="fence"></div>
          <div id="decor"></div>
        </div>
        <div class="gbot">
          <div class="path"></div>
          <div class="plots" id="album"></div>
          <div id="walkers"></div>
        </div>
        <div class="fxl" id="fxl"></div>
      </div>
      <div class="tip" id="gardenCount"></div>
      <div class="label" data-t="toPractice"></div>
      <div class="tip" id="weak"></div>
    </div>

    <div class="card">
      <div class="label" data-t="myPet"></div>
      <div class="chips" id="mascots"></div>
      <div class="label" data-t="whatWeCount"></div>
      <div class="chips" id="types">
        <button class="chip" data-type="pm">X ± Y = ?</button>
        <button class="chip" data-type="fill">X ± ? = Y</button>
        <button class="chip" data-type="cmp">&gt; &lt; =</button>
        <button class="chip" data-type="mix" data-t="typesAll"></button>
      </div>
      <div class="label" data-t="upToLabel"></div>
      <div class="chips" id="levels">
        <button class="chip" data-level="10"></button>
        <button class="chip" data-level="20"></button>
        <button class="chip" data-level="50"></button>
        <button class="chip" data-level="100"></button>
        <button class="chip" id="autoBtn"></button>
      </div>
      <div class="label" data-t="seasonLabel"></div>
      <div class="chips" id="seasons">
        <button class="chip" data-season="auto" data-t="seasonAuto"></button>
        <button class="chip" data-season="spring" data-t="spring"></button>
        <button class="chip" data-season="summer" data-t="summer"></button>
        <button class="chip" data-season="autumn" data-t="autumn"></button>
        <button class="chip" data-season="winter" data-t="winter"></button>
      </div>
      <div style="text-align:center;margin-top:18px">
        <button class="chip" id="resetBtn" data-t="reset"></button>
      </div>
    </div>
    <div class="card" id="backupCard">
      <div class="label" data-t="backupTitle"></div>
      <div style="text-align:center"><button class="chip" id="backupBtn" data-t="backupShow"></button></div>
      <div id="backupBox" class="hidden">
        <p class="tip" data-t="backupCopyHint"></p>
        <textarea id="backupOut" readonly rows="4" style="width:100%;font-size:12px"></textarea>
        <div style="text-align:center;margin-top:8px"><button class="chip" id="backupCopy" data-t="backupCopyBtn"></button></div>
        <p class="tip" data-t="backupRestoreHint"></p>
        <textarea id="backupIn" rows="3" style="width:100%;font-size:12px"></textarea>
        <div style="text-align:center;margin-top:8px"><button class="chip" id="backupRestore" data-t="backupRestoreBtn"></button></div>
        <p class="tip" id="backupMsg"></p>
      </div>
    </div>
  </section>

  <!-- HRA -->
  <section id="play" class="screen hidden">
    <div class="card" style="text-align:center">
      <div class="track"><div class="progress" id="progress"></div><span class="rider" id="rider"></span></div>
      <div class="rowtop">
        <span class="mascotP" id="mascotP">🦄</span>
        <span class="tip" id="streakTxt"></span>
      </div>
      <div class="story hidden" id="story"></div>
      <div class="task" id="task"></div>
      <button class="chip say" id="sayBtn" data-t="speakBtn"></button>
      <div class="hint" id="hint"></div>
      <div class="ans empty" id="ans">?</div>
      <div class="feedback" id="fb"></div>
      <div class="pad" id="pad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>

let ac = null;
function tone(f, t, d, type = 'sine', v = 0.18) {
  if (!S.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const s = ac.currentTime + t;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, s);
    g.gain.exponentialRampToValueAtTime(v, s + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, s + d);
    o.connect(g); g.connect(ac.destination);
    o.start(s); o.stop(s + d + 0.05);
  } catch (e) {}
}

function b64ToBuf(b64) {
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);

/* Odstráni dlhé ticho na začiatku a na konci nahrávky, aby medzi číslami nebola pauza.
   Hranica je 5 % najhlasnejšieho miesta, takže sa nerezú slabé konce slov. */
function trimClip(buf) {
  try {
    const ctx = getCtx();
    if (!ctx) return buf;
    const ch = buf.getChannelData(0);
    // hlasitosť po 20 ms oknách (RMS), aby jednotlivé šumy na konci nepredĺžili nahrávku
    const win = Math.max(1, Math.floor(buf.sampleRate * 0.02));
    const rms = [];
    let peakR = 0;
    for (let i = 0; i < ch.length; i += win) {
      let sum = 0, n = 0;
      for (let j = i; j < Math.min(ch.length, i + win); j++) { sum += ch[j] * ch[j]; n++; }
      const r = Math.sqrt(sum / n);
      rms.push(r);
      if (r > peakR) peakR = r;
    }
    if (!peakR) return buf;
    const th = peakR * 0.03;   // nízka hranica, aby sa neorezali slabé spoluhlásky (s, ť)
    const first = rms.findIndex(r => r > th);
    if (first < 0) return buf;
    let last = rms.length - 1;
    while (last > first && rms[last] <= th) last--;
    const s = Math.max(0, first * win - Math.floor(buf.sampleRate * 0.08));
    const e = Math.min(ch.length - 1, (last + 1) * win + Math.floor(buf.sampleRate * 0.2));   // dlhší dych po slove
    const out = ctx.createBuffer(buf.numberOfChannels, e - s + 1, buf.sampleRate);
    for (let c = 0; c < buf.numberOfChannels; c++) out.copyToChannel(buf.getChannelData(c).subarray(s, e + 1), c);
    return out;
  } catch (e) { return buf; }
}
function loadClip(key) {
  if (!clipCache[key]) {
    clipCache[key] = CLIPS_READY.then(() => {
      const b64 = window.LARA_CLIPS && window.LARA_CLIPS[LANG] && window.LARA_CLIPS[LANG][key];
      if (b64) return getCtx().decodeAudioData(b64ToBuf(b64)).then(trimClip);
      return fetch(AUDIO_BASE + key + '.mp3')
        .then(r => { if (!r.ok) throw new Error('missing'); return r.arrayBuffer(); })
        .then(b => getCtx().decodeAudioData(b)).then(trimClip);
    }).catch(() => null);
  }
  return clipCache[key];
}

  if (!S.sound) return;
  const c = getCtx();
  if (!c) { say(fallbackText); return; }
  if (c.state !== 'running') {   // iPad môže byť v stave „interrupted“; čakáme najviac 0,4 s, aby sa nezasekla hra
    try { await Promise.race([c.resume(), new Promise(r => setTimeout(r, 400))]); } catch (e) {}
  }
  const id = ++seqId;
  srcs.forEach(s => { try { s.stop(); } catch (e) {} });
  srcs = [];
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const bufs = await Promise.all(keys.map(k => loadClip(typeof k === 'number' ? 'n' + k : k)));
  if (id !== seqId) return;
  if (bufs.some(b => !b)) { say(fallbackText); return; }
  let t = c.currentTime + 0.05;
  bufs.forEach(b => {
    const s = c.createBufferSource();
    s.buffer = b;
    s.connect(c.destination);
    s.start(t);
    t += b.duration + 0.06;
    srcs.push(s);
  });
}

let lastKey = '';
function kvet(n) {               // slovenský tvar slova "kvet" (len pre slovenskú verziu)
  const d = n % 10, t = n % 100;
  if (n === 1) return 'kvet';
  if (d >= 2 && d <= 4 && (t < 12 || t > 14)) return 'kvety';
  return 'kvetov';
}
function kvetKey(n) {            // kľúč nahrávky pre tvar slova "kvet" (slovenčina)
  const d = n % 10, t = n % 100;
  if (n === 1) return 'kvet';
  if (d >= 2 && d <= 4 && (t < 12 || t > 14)) return 'kvety';
  return 'kvetov';
}
const SND = (en, sk) => (LANG === 'en' ? en : sk);   // zoznam nahrávok pre aktuálny jazyk
function frames(seq, total) {    // desiatkový rámik: 10 políčok na jeden rámik
  const slots = Math.max(10, Math.ceil(total / 10) * 10);
  let h = '';
  for (let f = 0; f < slots / 10; f++) {
    h += '<div class="frame">';
    for (let i = 0; i < 10; i++) h += `<i class="cell ${seq[f * 10 + i] || 'empty'}"></i>`;
    h += '</div>';
  }
  return `<div class="frames">${h}</div>`;
}
function genTask(mode, max) {
  const story = Math.random() < 0.3;
  if (mode === 'plus') {
    const c = rnd(2, max), a = rnd(1, c - 1), b = c - a;
    return {
      op: '+', a, b, total: c, g1: a, g2: b, mi: 0, ans: c,
      txt: `${a} + ${b} = ?`, key: `+${a},${b}`,
      html: `${a} + ${b} = <span class="q">?</span>`,
      speak: T('speakPlus', { a, b }),
      step: T('stepPlus', { a, b }),
      story: story ? T('storyPlus', { a, b, kvet: kvet(a) }) : null,
      snd: story ? SND(['fairyhad', a, 'flowersgot', b, 'storyq'], ['vilamala', a, kvetKey(a), 'adostala', b, 'kolkokvetov'])
                 : SND(['whatis', a, 'plus', b], ['kolkoje', a, 'plus', b]),
    };
  }
  if (mode === 'minus') {
    const a = rnd(2, max), b = rnd(1, a - 1), c = a - b;
    return {
      op: '−', a, b, total: a, g1: c, g2: b, mi: 0, ans: c,
      txt: `${a} − ${b} = ?`, key: `-${a},${b}`,
      html: `${a} − ${b} = <span class="q">?</span>`,
      speak: T('speakMinus', { a, b }),
      step: T('stepMinus', { a, b }),
      story: story ? T('storyMinus', { a, b, kvet: kvet(a), bolo: a <= 4 ? 'boli' : 'bolo' }) : null,
      snd: story ? SND(['gardenhad', a, 'flowerspicked', b, 'storyq2'], [a <= 4 ? 'vzahradeboli' : 'vzahrade', a, kvetKey(a), 'princezna', b, 'znichnatrhala'])
                 : SND(['whatis', a, 'minus', b], ['kolkoje', a, 'minus', b]),
    };
  }
  if (mode === 'fillPlus') {
    const c = rnd(2, max), k = rnd(1, c - 1), m = c - k;
    return Math.random() < 0.5
      ? { op: '+', a: m, b: k, total: c, g1: m, g2: k, mi: 1, ans: m, story: null,
          txt: `? + ${k} = ${c}`, key: `f+${c},${k},1`,
          html: `<span class="q">?</span> + ${k} = ${c}`,
          speak: T('speakFillPlusFront', { k, c }),
          step: T('stepFillPlusFront', { k, c }),
          snd: SND(['whatplus', k, 'is', c], ['kolkoplus', k, 'je', c]) }
      : { op: '+', a: k, b: m, total: c, g1: k, g2: m, mi: 2, ans: m, story: null,
          txt: `${k} + ? = ${c}`, key: `f+${c},${k},2`,
          html: `${k} + <span class="q">?</span> = ${c}`,
          speak: T('speakFillPlusBack', { k, c }),
          step: T('stepFillPlusBack', { k, c }),
          snd: SND([k, 'pluswhatis', c], [k, 'pluskolkoje', c]) };
  }
  if (mode === 'fillMinus') {
    const a = rnd(2, max), m = rnd(1, a - 1), c = a - m;
    return { op: '−', a, b: m, total: a, g1: c, g2: m, mi: 2, ans: m, story: null,
      txt: `${a} − ? = ${c}`, key: `f-${a},${m}`,
      html: `${a} − <span class="q">?</span> = ${c}`,
      speak: T('speakFillMinus', { a, c }),
      step: T('stepFillMinus', { a, c }),
      snd: SND([a, 'minuswhatis', c], [a, 'minuskolkoje', c]) };
  }
  // porovnanie: >, <, =
  const a = rnd(1, max), b = Math.random() < 0.15 ? a : rnd(1, max);
  const sym = a > b ? '>' : a < b ? '<' : '=';
  return { op: 'cmp', a, b, total: 0, ans: sym, story: null,
    txt: `${a} ? ${b}`, key: `c${a},${b}`,
    html: `${a} <span class="q">?</span> ${b}`,
    speak: T('speakCmp', { a, b }),
    step: a === b ? T('hintSame') : T('hintBigger', { n: Math.max(a, b) }),
    snd: SND(['compare', a, 'and', b, 'moreless'], ['porovnaj', a, 'a', b, 'vacsie']) };
}
function makeTask() {
  let t, key;
  do {
    let mode = S.types;
    if (mode === 'mix') mode = pick(['plus', 'minus', 'fill', 'cmp']);
    if (mode === 'pm') mode = Math.random() < 0.5 ? 'plus' : 'minus';
    if (mode === 'fill') mode = Math.random() < 0.5 ? 'fillPlus' : 'fillMinus';
    t = genTask(mode, S.level);
    key = t.key;
  } while (key === lastKey);
  lastKey = key;
  return t;
}
/* pomôcka pre dvojciferné čísla: počítadlo s desiatkami a jednotkami (dieťa ťuká na guličky).
   Sčítanie: ťuknutím sa počítajú guličky. Odčítanie: ťuknutím sa odoberajú guličky.
   Desiatka sa pri odčítaní rozmení na 10 jednotiek, ak treba. */
function cntState(t) {
  if (!R.cnt || R.cnt.key !== t.key) {
    R.cnt = t.op === '+'
      ? { key: t.key, done: {} }
      : { key: t.key, T: Math.floor(t.a / 10), O: t.a % 10, taken: 0, msg: '' };
  }
  return R.cnt;
}
function cntGroupPlus(gid, n, st) {
  let bars = '', dots = '';
  for (let i = 0; i < Math.floor(n / 10); i++) {
    const id = gid + 't' + i;
    bars += `<span class="cnt-item bar${st.done[id] ? ' done' : ''}" data-id="${id}"></span>`;
  }
  for (let j = 0; j < n % 10; j++) {
    const id = gid + 'o' + j;
    dots += `<span class="cnt-item dot${st.done[id] ? ' done' : ''}" data-id="${id}"></span>`;
  }
  return `<div class="cnt-grp"><div class="cnt-bars">${bars}</div><div class="cnt-dots">${dots}</div></div>`;
}
function cntGroupMinus(st) {
  let bars = '', dots = '';
  for (let i = 0; i < st.T; i++) bars += `<span class="cnt-item bar" data-id="mt"></span>`;
  for (let j = 0; j < st.O; j++) dots += `<span class="cnt-item dot" data-id="mo"></span>`;
  return `<div class="cnt-grp"><div class="cnt-bars">${bars}</div><div class="cnt-dots">${dots}</div></div>`;
}
function cntHTML(t) {
  const st = cntState(t);
  if (t.op === '+') {
    const counted = Object.keys(st.done).filter(k => st.done[k]).reduce((s, k) => s + (k.includes('t') ? 10 : 1), 0);
    const info = counted === t.total ? T('cntSum', { n: t.total }) : T('cntCounted', { n: counted });
    return `<div class="cnt-wrap">${cntGroupPlus('A', t.a, st)}<div class="cnt-op">+</div>${cntGroupPlus('B', t.b, st)}<div class="cnt-info">${info}</div></div>`;
  }
  const left = t.a - st.taken;
  const info = st.taken === t.b ? T('cntLeft', { n: left }) : T('cntTaken', { n: st.taken, left });
  return `<div class="cnt-wrap">${cntGroupMinus(st)}<div class="cnt-info">${info}</div>${st.msg ? `<div class="cnt-msg">${st.msg}</div>` : ''}</div>`;
}
function cntTap(t, el) {
  const st = cntState(t);
  if (t.op === '+') {
    if (st.done[el.dataset.id]) return;
    st.done[el.dataset.id] = true;
    return;
  }
  if (st.taken >= t.b) return;
  st.msg = '';
  if (el.classList.contains('bar')) {
    if (st.T <= 0) return;
    if (st.taken + 10 <= t.b) { st.T--; st.taken += 10; }
    else { st.T--; st.O += 10; st.msg = T('cntSplit'); }   // desiatku treba rozmeniť
  } else {
    if (st.O <= 0) return;
    st.O--; st.taken++;
  }
}
// pomôcka: desiatkový rámik pre čísla do 20, inak len text kroku
function hintHTML(t, reveal) {
  if ((t.op === '+' || t.op === '−') && t.mi === 0 && t.total > 20 && !reveal) {
    const open = !!R.cntOpen;
    return `<div class="hintbox" data-left="${t.g1}"><button class="chip help-btn" type="button" id="helpBtn">${T(open ? 'helpHide' : 'helpBtn')}</button>` +
      (open ? cntHTML(t) : '') + `<div class="tip">${t.step}</div></div>`;
  }
  if (t.op === 'cmp' || t.total > 20) return `<div class="tip">${t.step}</div>`;
  const tappable = t.op === '−' && t.mi === 0 && !reveal;   // odčítanie: dieťa ťukne na to, čo odíde
  const tip = `<div class="tip">${t.step}</div>` + (tappable ? `<div class="tip tapmsg">${T('tapHint')}</div>` : '');
  if (t.story) return `<div class="hintbox" data-left="${t.g1}">${flowerRow(t, reveal, tappable)}${tip}</div>`;
  const M = reveal ? 'gold' : 'ghost';
  const c1 = t.mi === 1 ? M : 'blue';
  const c2 = t.mi === 2 ? M : (t.op === '−' ? (tappable ? 'yellow tap' : 'out') : 'yellow');
  const seq = Array(t.g1).fill(c1).concat(Array(t.g2).fill(c2));
  return `<div class="hintbox" data-left="${t.g1}">${frames(seq, t.total)}${tip}</div>`;
}
// slovná úloha: namiesto guličiek kvety zo záhrady (ten istý príbeh ako v zadaní)
function flowerRow(t, reveal, tappable) {
  const f = itemSVG('flower', 34);
  const kept = Array(t.g1).fill(`<span class="fl">${f}</span>`).join('');
  const picked = t.op === '−'
    ? Array(t.g2).fill(`<span class="fl ${tappable ? 'tap' : 'faded'}">${f}</span>`).join('')
    : Array(t.g2).fill(`<span class="fl">${f}</span>`).join('');
  return `<div class="flrow">${kept}${picked}</div>`;
}

/* ====== HRA ====== */
let R = null;   // stav kola
let streak = 0; // séria správnych odpovedí

function startRound() {
  R = { res: [], queue: [], ok: 0, first: 0, gained: 0, t: null, tries: 0, done: false, input: '' };
  $('#mascotP').innerHTML = laraSVG(64);
  show('play');
  playSeq(['praise1'], T('praise1', { name: S.name }));
  startTask();
}
function startTask() {
  // úlohy, ktoré sa nepodarili, sa niekedy zopakujú
  const useRetry = R.queue.length > 0 && R.res.length >= 2 && Math.random() < 0.6;
  R.t = useRetry ? R.queue.shift() : makeTask();
  R.t.retry = useRetry;
  R.res.push('');
  R.tries = 0; R.done = false; R.input = '';
  const st = $('#story');
  st.textContent = R.t.story || '';
  st.classList.toggle('hidden', !R.t.story);
  $('#task').innerHTML = R.t.html;
  $('#fb').textContent = '';
  R.cntOpen = false; R.cnt = null;
  // dvojciferné úlohy: tlačidlo „Pomôž si“ je k dispozícii hneď, ostatné nápovedy až po chybe
  const twoDigit = (R.t.op === '+' || R.t.op === '−') && R.t.mi === 0 && R.t.total > 20;
  $('#hint').innerHTML = twoDigit ? `<button class="chip help-btn" type="button" id="helpBtn">${T('helpBtn')}</button>` : '';
  $('#pad').classList.remove('off');
  $('#cmpBtns').classList.remove('off');
  const isCmp = R.t.op === 'cmp';
  $('#pad').classList.toggle('hidden', isCmp);
  $('#cmpBtns').classList.toggle('hidden', !isCmp);
  $('#nextBtn').classList.add('hidden');
  $('#streakTxt').textContent = R.t.retry ? T('retry') : (streak > 1 ? T('streakBadge', { n: streak }) : '');
  updateAns();
  renderProgress();
  playSeq(R.t.snd, R.t.story || R.t.speak);
}
// spoločník pokračuje po číselnej osi: pozícia zodpovedá počtu správnych odpovedí v kole
function renderRider() {
  const el = $('#rider');
  el.innerHTML = mascotSVG(S.mascot, 48, 'idle');
  const dots = document.querySelectorAll('#progress .pd');
  if (!dots.length) return;
  const d = dots[Math.min(R.ok, dots.length - 1)];   // nad políčkom, ktoré zodpovedá počtu správnych odpovedí
  el.style.left = (d.offsetLeft + d.offsetWidth / 2) + 'px';
}
function renderProgress() {
  $('#progress').innerHTML = Array.from({ length: CONFIG.ROUND_LENGTH }, (_, i) => {
    const st = R.res[i] || '';
    const cur = (i === R.res.length - 1 && !R.done) ? ' cur' : '';
    return `<span class="pd ${st}${cur}"></span>`;
  }).join('');
  renderRider();
}
function updateAns() {
  const el = $('#ans');
  el.textContent = R.input || '?';
  el.classList.toggle('empty', !R.input);
}
function fb(text, good) {
  const el = $('#fb');
  el.textContent = text;
  el.style.color = good ? 'var(--green)' : 'var(--ink)';
}
function gain(n) {
  S.stars += n;
  if (R) R.gained += n;
  save(); renderTop(); flyPlus(n);
}
function press(k) {
  if (R.done) return;
  if (k === 'ok') return check();
  if (k === 'del') R.input = R.input.slice(0, -1);
  else if (!(R.input === '' && k === '0') && R.input.length < 4) R.input += k;
  SFX.tap();
  updateAns();
}
function chooseCmp(sym) {
  if (R.done) return;
  R.input = sym;
  SFX.tap();
  updateAns();
  check();
}
function check() {
  if (R.input === '') { bump($('#ans'), 'shake'); return; }
  const given = R.t.op === 'cmp' ? R.input : parseInt(R.input, 10);
  R.tries++;
  if (given === R.t.ans) win();
  else if (R.tries === 1) {
    SFX.oops();
    bump($('#mascotP'), 'sad');
    S.miss[R.t.txt] = (S.miss[R.t.txt] || 0) + 1;
    fb(T('tryAgain'), false);
    playSeq(['tryagain'], T('speakTry'));
    R.input = ''; updateAns();
    $('#hint').innerHTML = hintHTML(R.t, false);
  } else lose();
  save();
}
function win() {
  R.done = true;
  const first = R.tries === 1;
  R.res[R.res.length - 1] = 'ok';
  R.ok++; if (first) R.first++;
  S.stats.right++; S.stats.total++;
  streak++;
  S.bestStreak = Math.max(S.bestStreak, streak);
  gain(first ? CONFIG.STARS_FIRST_TRY : CONFIG.STARS_SECOND_TRY);
  let msg = first ? T('great') : T('correctSecond');
  if (streak % CONFIG.STREAK_EVERY === 0) {
    gain(CONFIG.STREAK_BONUS);
    msg = T('streakMsg', { n: streak, b: CONFIG.STREAK_BONUS });
    SFX.win(); confetti(20);
  } else { SFX.ok(); confetti(8); }
  fb(msg, true);
  bump($('#mascotP'), 'happy');
  bump($('#rider'), 'happy');
  const pk = 'praise' + rnd(1, 3);
  if (first) playSeq([pk], T(pk, { name: S.name }));
  else playSeq(['correct'], T('speakRight'));
  $('#hint').innerHTML = '';   // po správnej odpovedi pomôcku nezobrazujeme
  finishTask();
}
function lose() {
  R.done = true;
  R.res[R.res.length - 1] = 'bad';
  R.queue.push(R.t);             // zopakujeme neskôr v tom istom kole
  S.stats.total++;
  streak = 0;
  SFX.oops();
  bump($('#mascotP'), 'sad');
  R.input = String(R.t.ans); updateAns();
  gain(CONFIG.STARS_EFFORT);
  fb(`${T('answerIs', { a: R.t.ans })} ${T('effort', { n: CONFIG.STARS_EFFORT })}`, false);
  $('#hint').innerHTML = hintHTML(R.t, true);
  finishTask();
}
function finishTask() {
  $('#pad').classList.add('off');
  $('#cmpBtns').classList.add('off');
  $('#nextBtn').textContent = R.res.length >= CONFIG.ROUND_LENGTH ? T('results') : T('next');
  $('#nextBtn').classList.remove('hidden');
  renderProgress();
  save();
}
function next() {
  if (!R || !R.done) return;
  if (R.res.length >= CONFIG.ROUND_LENGTH) return endRound();
  startTask();
}
function endRound() {
  let bonus = 0, msg, mk;
  if (R.first === CONFIG.ROUND_LENGTH) { bonus = CONFIG.ROUND_BONUS_PERFECT; msg = T('perfect'); mk = 'perfect'; }
  else if (R.ok >= 8) { bonus = CONFIG.ROUND_BONUS_GOOD; msg = T('veryGood'); mk = 'verygood'; }
  else { msg = T('good'); mk = 'good'; }
  if (bonus) gain(bonus);

  // automatická obtiažnosť
  let levelMsg = '';
  const i = LEVELS.indexOf(S.level);
  if (S.auto) {
    if (R.first >= 8 && i < LEVELS.length - 1) {
      S.level = LEVELS[i + 1];
      levelMsg = T('levelUp', { n: S.level });
    } else if (R.ok <= 4 && i > 0) {
      S.level = LEVELS[i - 1];
      levelMsg = T('levelDown', { n: S.level });
    }
  }

  S.rounds++;
  save();
  const cheapest = Math.min(...STICKERS.filter(s => !S.unlocked.includes(s.id)).map(s => s.price), Infinity);
  const shopMsg = S.stars >= cheapest ? T('shopHint') : '';
  $('#doneMascot').innerHTML = mascotSVG(S.mascot, 110, 'idle');
  $('#doneMsg').textContent = msg;
  $('#dOk').textContent = `${R.ok}/${CONFIG.ROUND_LENGTH}`;
  $('#dStars').textContent = `+${R.gained}`;
  $('#doneHint').textContent = [levelMsg, shopMsg].filter(Boolean).join(' ');
  SFX.win(); confetti(25);
  playSeq([mk], msg);
  renderHome();
  show('done');
}

/* ====== ZÁHRADA – SCÉNA ====== */
const SEASON_KEYS = ['spring', 'summer', 'autumn', 'winter'];
const POND_CELL = `<div class="pond-cell"><div class="water"><i class="lily l1"></i><i class="lily l2"></i><i class="ripple"></i></div></div>`;
const HOUSE_SVG = `<svg viewBox="0 0 140 120" aria-hidden="true">
  <rect x="26" y="50" width="88" height="62" rx="4" fill="#fff1d6" stroke="#e0c49a" stroke-width="2"/>
  <polygon points="14,56 70,12 126,56" fill="#ff8c7a" stroke="#d96a5a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="92" y="18" width="13" height="28" fill="#c97a6a"/>
  <circle cx="70" cy="42" r="6" fill="#ffd23c" stroke="#e8b400" stroke-width="1.5"/>
  <rect x="56" y="70" width="28" height="42" rx="13" fill="#8a5a3c"/>
  <circle cx="78" cy="94" r="2" fill="#ffd23c"/>
  <rect x="34" y="64" width="16" height="16" rx="3" fill="#bfe9ff" stroke="#9fd0ee" stroke-width="1.5"/>
  <rect x="90" y="64" width="16" height="16" rx="3" fill="#bfe9ff" stroke="#9fd0ee" stroke-width="1.5"/>
  <circle cx="22" cy="110" r="5" fill="#ff8fbf"/><circle cx="118" cy="110" r="5" fill="#ffd23c"/>
</svg>`;
const LAMP_SVG = `<svg viewBox="0 0 30 80" aria-hidden="true">
  <rect x="13" y="22" width="4" height="58" rx="2" fill="#8a6a5a"/>
  <circle cx="15" cy="14" r="10" fill="#ffe08a" stroke="#e8b84a" stroke-width="2"/>
  <rect x="9" y="76" width="12" height="4" rx="2" fill="#8a6a5a"/>
</svg>`;
function currentSeason() {
  return S.season !== 'auto' ? S.season : SEASON_KEYS[Math.floor(S.rounds / 3) % SEASON_KEYS.length];
}
function renderGarden(owned) {
  const season = currentSeason();
  const ANIMAL_IDS = ['puppy', 'bunny', 'koala', 'turtle', 'elephant', 'giraffe', 'lion', 'tiger', 'owl', 'penguin', 'flamingo', 'cat', 'fox', 'panda', 'unicorn', 'trex'];
  $('#scene').className = 'gscene ' + season;
  // zvieratká chodia po záhrade, ostatné kúsky sú na záhone
  const walkers = owned.filter(s => ANIMAL_IDS.includes(s.id)).slice(0, 4);
  const plants = owned.filter(s => !walkers.includes(s));
  let decor = `<div class="house">${HOUSE_SVG}</div>`;
  if (owned.length >= 6) decor += `<div class="lamp">${LAMP_SVG}</div>`;
  $('#decor').innerHTML = decor;
  const pondCells = owned.length >= 3 ? 2 : 0;
  const cells = Math.max(12, Math.ceil((plants.length + pondCells) / 4) * 4);
  let g = pondCells ? POND_CELL : '';
  for (let i = 0; i < cells - pondCells; i++) {
    const s = plants[i];
    g += s
      ? `<div class="plot" title="${sName(s)}"><span class="plant" style="animation-delay:${-(i % 5) * 0.7}s">${itemSVG(s.id, 52)}</span></div>`
      : '<div class="plot empty"><span class="sprout">🌱</span></div>';
  }
  $('#album').innerHTML = g;
  $('#walkers').innerHTML = walkers.map((s, i) =>
    `<div class="walker" style="top:${12 + i * 20}%;animation-duration:${20 + i * 6}s;animation-delay:${-i * 7}s">${itemSVG(s.id, 54)}</div>`).join('');
  $('#fxl').innerHTML = Array.from({ length: 10 }, (_, i) =>
    `<i class="p ${season}" style="left:${(i * 37) % 100}%;animation-delay:${-(i * 1.7)}s;animation-duration:${(season === 'summer' ? 7 : 9) + (i % 4) * 2}s"></i>`).join('');
  $('#gardenCount').textContent = T('gardenCount', { n: owned.length, total: STICKERS.length, season: T(season) });
}

/* ====== OBCHOD ====== */
function renderShop() {
  $('#shopSub').textContent = T('haveStars', { n: S.stars });
  $('#shopGrid').innerHTML = [...STICKERS].sort((a, b) => a.price - b.price).map(s => {
    const own = S.unlocked.includes(s.id);
    return `<button class="st ${own ? 'owned' : ''}" data-buy="${s.id}" ${own ? 'disabled' : ''}>
      <span class="se">${itemSVG(s.id, 56)}</span>${sName(s)}<small>${own ? '✓' : s.price + ' ⭐'}</small></button>`;
  }).join('');
  $('#companionGrid').innerHTML = MASCOTS.map(m => {
    const own = S.companions.includes(m.id);
    const active = own && S.mascot === m.id;
    return `<button class="st ${own ? 'owned' : ''} ${active ? 'on' : ''}" data-comp="${m.id}">
      <span class="se">${mascotSVG(m.id, 56)}</span>${mName(m)}<small>${own ? (active ? '✓ ' + T('on') : '✓') : m.price + ' ⭐'}</small></button>`;
  }).join('');
  $('#shopMsg').textContent = '';
}

/* ====== UDALOSTI ====== */
$('#startBtn').onclick = () => { SFX.tap(); startRound(); };
$('#againBtn').onclick = () => { SFX.tap(); startRound(); };
$('#backHomeBtn').onclick = () => { renderHome(); show('home'); };
$('#homeBtn').onclick = () => { renderHome(); show('home'); };
$('#shopBtn').onclick = () => { renderShop(); show('shop'); };
$('#shopBack').onclick = () => { renderHome(); show('home'); };
$('#nextBtn').onclick = next;
$('#sayBtn').onclick = () => playSeq(R.t.snd, R.t.story || R.t.speak);
// odčítanie: každá guľôčka, na ktorú dieťa ťukne, odletí a ozve sa počet
$('#hint').addEventListener('click', e => {
  // pomôcka pre dvojciferné čísla: tlačidlo a guličky počítadla
  if (e.target.closest('#helpBtn')) {
    R.cntOpen = !R.cntOpen;
    $('#hint').innerHTML = hintHTML(R.t, false);
    return;
  }
  const ci = e.target.closest('.cnt-item');
  if (ci && R.cntOpen) {
    cntTap(R.t, ci);
    if (S.sound) SFX.tap();
    $('#hint').innerHTML = hintHTML(R.t, false);
    return;
  }
  const c = e.target.closest('.tap');
  if (!c || c.classList.contains('gone')) return;
  c.classList.add('gone');
  const gone = document.querySelectorAll('#hint .gone').length;
  const done = !document.querySelector('#hint .tap:not(.gone)');
  const left = Number(document.querySelector('#hint .hintbox').dataset.left);
  // jedno hlásenie na ťuknutie: vždy počet odobratých (pri poslednej guličke "päť", nie zvyšok "jeden")
  playSeq([gone], String(gone));
  const msg = document.querySelector('#hint .tapmsg');
  if (msg) msg.textContent = done ? T('tapLeft', { n: left }) : T('tapCount', { n: gone });
  if (done) fb(T('tapLeft', { n: left }), true);
});
$('#langBtn').onclick = () => { location.href = LANG === 'en' ? 'sk/' : '../'; };
$('#pad').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) press(b.dataset.k);
});
$('#cmpBtns').addEventListener('click', e => {
  const b = e.target.closest('[data-s]');
  if (b) chooseCmp(b.dataset.s);
});
document.addEventListener('keydown', e => {
  if ($('#play').classList.contains('hidden') || e.target.tagName === 'INPUT') return;
  if (e.key === 'Enter') { if (R.done) next(); else press('ok'); return; }
  if (R.t.op === 'cmp') {
    if (['<', '>', '='].includes(e.key)) chooseCmp(e.key);
    return;
  }
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') press('del');
});
$('#mascotBig').onclick = () => {
  bump($('#mascotBig'), 'happy'); SFX.tap();
  const m = MASCOTS.find(x => x.id === S.mascot) || MASCOTS[0];
  playSeq(['hilara'], T('mascotHi', { name: S.name, mascot: mName(m) }));
};
$('#soundBtn').onclick = () => {
  S.sound = !S.sound; save(); renderTop();
  if (S.sound) SFX.tap();
};
$('#mascots').onclick = e => {
  const b = e.target.closest('[data-m]');
  if (!b) return;
  S.mascot = b.dataset.m; save(); renderHome(); applyStatic();
};
$('#types').onclick = e => {
  const b = e.target.closest('[data-type]');
  if (!b) return;
  S.types = b.dataset.type; save(); renderHome();
};
$('#levels').onclick = e => {
  const b = e.target.closest('[data-level]');
  if (!b) return;
  S.level = Number(b.dataset.level); save(); renderHome();
};
$('#autoBtn').onclick = () => { S.auto = !S.auto; save(); renderHome(); };
$('#seasons').onclick = e => {
  const b = e.target.closest('[data-season]');
  if (!b) return;
  S.season = b.dataset.season; save(); renderHome();
};
/* záloha postupu: celý stav hry ako kód (na presun medzi adresami) */
$('#backupBtn').onclick = () => {
  $('#backupBox').classList.toggle('hidden');
  $('#backupOut').value = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  $('#backupMsg').textContent = '';
};
$('#backupCopy').onclick = () => {
  const ta = $('#backupOut');
  ta.select(); ta.setSelectionRange(0, 999999);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  $('#backupMsg').textContent = ok ? T('backupCopied') : '';
};
$('#backupRestore').onclick = () => {
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob($('#backupIn').value.trim()))));
    if (!data || !data.stats) throw new Error('bad');
    S = Object.assign(defaults(), data);
    if (!Array.isArray(S.companions) || !S.companions.includes('bunny')) S.companions = ['bunny'];
    if (!S.companions.includes(S.mascot)) S.mascot = 'bunny';
    save(); renderHome(); renderTop();
    $('#backupMsg').textContent = T('backupDone');
  } catch (e) {
    $('#backupMsg').textContent = T('backupBad');
  }
};
$('#resetBtn').onclick = () => {
  if (!confirm(T('resetConfirm'))) return;
  const keep = { name: S.name, mascot: S.mascot, sound: S.sound, level: S.level, types: S.types, auto: S.auto, season: S.season, companions: S.companions };
  S = Object.assign(defaults(), keep);
  save(); renderHome();
};
$('#companionGrid').onclick = e => {
  const b = e.target.closest('[data-comp]');
  if (!b) return;
  const m = MASCOTS.find(x => x.id === b.dataset.comp);
  if (S.companions.includes(m.id)) { S.mascot = m.id; save(); renderShop(); renderHome(); return; }
  if (S.stars < m.price) {
    SFX.oops();
    $('#shopMsg').textContent = T('needMore', { n: m.price - S.stars });
    return;
  }
  S.stars -= m.price;
  S.companions.push(m.id);
  S.mascot = m.id;
  save(); SFX.ok(); confetti(12);
  $('#shopMsg').textContent = T('bought', { name: mName(m) });
  renderShop(); renderTop();
};
$('#shopGrid').onclick = e => {
  const b = e.target.closest('[data-buy]');
  if (!b) return;
  const s = STICKERS.find(x => x.id === b.dataset.buy);
  if (S.stars < s.price) {
    SFX.oops();
    $('#shopMsg').textContent = T('needMore', { n: s.price - S.stars });
    return;
  }
  S.stars -= s.price;
  S.unlocked.push(s.id);
  save(); SFX.ok(); confetti(12);
  $('#shopMsg').textContent = T('bought', { name: sName(s) });
  renderShop(); renderTop();
};

/* ====== ŠTART ====== */
applyStatic();
buildDeco();
renderHome();
show('home');
// ikona a názov na ploche iPadu, manifest a offline služba: správne aj keď je appka v /sk/
document.querySelector('link[rel=manifest]').href = ROOT + 'manifest.webmanifest';
document.querySelector('link[rel=apple-touch-icon]').href = ROOT + 'icon-180.png';
document.querySelector('meta[name=apple-mobile-web-app-title]').content = LANG === 'sk' ? 'Počty' : 'Lara Math';
// offline režim: služba sa spustí len na https (Netlify, GitHub) alebo localhost
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
  navigator.serviceWorker.register(ROOT + 'sw.js').catch(() => {});
}
</script>
